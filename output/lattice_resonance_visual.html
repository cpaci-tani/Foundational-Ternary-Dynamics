<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FTD Lattice Resonance: From Z[i] to Life</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #06060f; color: #ccc; font-family: 'Courier New', monospace; overflow-x: hidden; }
canvas { display: block; }
.overlay {
    position: fixed; top: 20px; left: 20px; z-index: 10;
    font-size: 13px; line-height: 1.6; pointer-events: none;
}
.overlay h1 { color: #fff; font-size: 18px; margin-bottom: 8px; }
.overlay .sub { color: #888; font-size: 11px; }
.controls {
    position: fixed; bottom: 20px; left: 20px; z-index: 10;
    font-size: 12px;
}
.controls label { display: block; margin: 4px 0; color: #aaa; cursor: pointer; }
.controls input[type=range] { width: 160px; vertical-align: middle; }
.controls button {
    background: #1a1a3a; color: #8af; border: 1px solid #335; padding: 6px 14px;
    margin: 4px 2px; cursor: pointer; font-family: inherit; font-size: 12px;
}
.controls button:hover { background: #2a2a5a; }
.controls button.active { background: #335; border-color: #8af; }
.info {
    position: fixed; top: 20px; right: 20px; z-index: 10;
    width: 260px; font-size: 11px; line-height: 1.5; color: #777;
    text-align: right;
}
.info .highlight { color: #4fc; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="overlay">
    <h1>Lattice Resonance</h1>
    <div class="sub">Z[i] &rarr; G* &rarr; Harmonics &rarr; Resonance &rarr; Life</div>
</div>

<div class="info" id="info">
    <div>Harmonics: <span class="highlight" id="nHarm">4</span></div>
    <div>Mode: <span class="highlight" id="modeName">Weierstrass Curve</span></div>
    <div id="extraInfo"></div>
</div>

<div class="controls">
    <label>Harmonics: <input type="range" id="harmonics" min="1" max="12" value="4" step="1"></label>
    <label>Speed: <input type="range" id="speed" min="0" max="100" value="30" step="1"></label>
    <label>Decay: <input type="range" id="decay" min="30" max="99" value="75" step="1"></label>
    <div style="margin-top:8px">
        <button id="btnCurve" class="active">Weierstrass Curve</button>
        <button id="btnLattice">3^3 Observer</button>
        <button id="btnResonance">Resonance Modes</button>
        <button id="btnLife">Life Cycle</button>
    </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;
let t = 0;
let mode = 'curve';
let nHarmonics = 4;
let speed = 0.015;
let trailDecay = 0.75;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    cx = W / 2;
    cy = H / 2;
}
window.addEventListener('resize', resize);
resize();

// Controls
document.getElementById('harmonics').addEventListener('input', e => {
    nHarmonics = parseInt(e.target.value);
    document.getElementById('nHarm').textContent = nHarmonics;
});
document.getElementById('speed').addEventListener('input', e => {
    speed = e.target.value / 2000;
});
document.getElementById('decay').addEventListener('input', e => {
    trailDecay = e.target.value / 100;
});

const buttons = { btnCurve: 'curve', btnLattice: 'lattice', btnResonance: 'resonance', btnLife: 'life' };
const modeNames = { curve: 'Weierstrass Curve', lattice: '3^3 Observer', resonance: 'Resonance Modes', life: 'Life Cycle' };
Object.entries(buttons).forEach(([id, m]) => {
    document.getElementById(id).addEventListener('click', () => {
        mode = m;
        document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('modeName').textContent = modeNames[m];
        t = 0;
    });
});

// ============================================================
// Weierstrass harmonic curve (user's formula, extended)
// ============================================================
function weierstrassPoint(t, n) {
    let x = 0, y = 0;
    for (let k = 0; k < n; k++) {
        const freq = Math.pow(2, k);
        const amp = Math.pow(0.6, k);
        const sign = (k % 2 === 0) ? 1 : -1;
        x += amp * Math.cos(freq * t);
        y += 2 * amp * sign * Math.sin(freq * t);
    }
    return [x, y];
}

function drawCurveMode() {
    const scale = Math.min(W, H) * 0.1;
    const info = document.getElementById('extraInfo');

    // Draw individual harmonics faintly
    for (let k = 0; k < nHarmonics; k++) {
        const freq = Math.pow(2, k);
        const amp = Math.pow(0.6, k);
        const hue = (k / nHarmonics) * 280;
        ctx.strokeStyle = `hsla(${hue}, 80%, 60%, 0.15)`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let i = 0; i <= 600; i++) {
            const tt = (i / 600) * Math.PI * 2;
            const sign = (k % 2 === 0) ? 1 : -1;
            const px = cx + amp * Math.cos(freq * tt) * scale;
            const py = cy - 2 * amp * sign * Math.sin(freq * tt) * scale;
            i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.stroke();
    }

    // Draw the full curve
    ctx.strokeStyle = '#ff3333';
    ctx.lineWidth = 2.5;
    ctx.shadowColor = '#ff3333';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    for (let i = 0; i <= 2000; i++) {
        const tt = (i / 2000) * Math.PI * 2;
        const [x, y] = weierstrassPoint(tt, nHarmonics);
        const px = cx + x * scale;
        const py = cy - y * scale;
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Animated point
    const [px, py] = weierstrassPoint(t, nHarmonics);
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.arc(cx + px * scale, cy - py * scale, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Labels
    ctx.fillStyle = '#555';
    ctx.font = '11px Courier New';
    for (let k = 0; k < nHarmonics; k++) {
        const hue = (k / nHarmonics) * 280;
        ctx.fillStyle = `hsl(${hue}, 70%, 50%)`;
        ctx.fillText(`harmonic ${k}: freq=2^${k}=${Math.pow(2,k)}, amp=${Math.pow(0.6,k).toFixed(3)}`, 20, H - 120 + k * 16);
    }

    info.innerHTML = `
        <div>Frequencies: 2<sup>0</sup> through 2<sup>${nHarmonics-1}</sup></div>
        <div>Truncated Weierstrass</div>
        <div style="color:#ff6644">Closed = resonant</div>
        <div style="color:#555;margin-top:6px">More harmonics &rarr; more structure</div>
        <div style="color:#555">Infinite &rarr; fractal (nowhere differentiable)</div>
        <div style="color:#555">Lattice cutoff &rarr; smooth at Planck scale</div>
    `;
}

// ============================================================
// 3^3 Observer lattice visualization
// ============================================================
function drawLatticeMode() {
    const info = document.getElementById('extraInfo');
    const scale = Math.min(W, H) * 0.08;
    const pulse = Math.sin(t * 3) * 0.3 + 0.7;

    // Draw 3^3 lattice
    const sites = [];
    for (let dx = -1; dx <= 1; dx++) {
        for (let dy = -1; dy <= 1; dy++) {
            for (let dz = -1; dz <= 1; dz++) {
                sites.push([dx, dy, dz]);
            }
        }
    }

    // Simple 3D projection
    const rot = t * 0.5;
    const tilt = 0.5;
    function proj(x, y, z) {
        const rx = x * Math.cos(rot) - z * Math.sin(rot);
        const rz = x * Math.sin(rot) + z * Math.cos(rot);
        const ry = y * Math.cos(tilt) - rz * Math.sin(tilt);
        const rz2 = y * Math.sin(tilt) + rz * Math.cos(tilt);
        const depth = 4 + rz2;
        return [cx + rx * scale * 3 / depth * 2, cy - ry * scale * 3 / depth * 2, depth];
    }

    // Draw edges
    ctx.strokeStyle = 'rgba(50,50,100,0.3)';
    ctx.lineWidth = 0.5;
    for (const s1 of sites) {
        for (const s2 of sites) {
            const dist = Math.abs(s1[0]-s2[0]) + Math.abs(s1[1]-s2[1]) + Math.abs(s1[2]-s2[2]);
            if (dist === 1) {
                const [x1,y1] = proj(...s1);
                const [x2,y2] = proj(...s2);
                ctx.beginPath();
                ctx.moveTo(x1,y1);
                ctx.lineTo(x2,y2);
                ctx.stroke();
            }
        }
    }

    // Draw sites sorted by depth
    const projected = sites.map(s => {
        const [px, py, depth] = proj(...s);
        const isCenter = s[0]===0 && s[1]===0 && s[2]===0;
        const dist = Math.sqrt(s[0]*s[0]+s[1]*s[1]+s[2]*s[2]);
        let type = 'corner'; // 8 corners
        if (dist < 1.1) type = 'face'; // 6 faces
        else if (dist < 1.5) type = 'edge'; // 12 edges
        if (isCenter) type = 'center';
        return { px, py, depth, type, s };
    });
    projected.sort((a,b) => a.depth - b.depth);

    for (const p of projected) {
        let r, color;
        if (p.type === 'center') {
            r = 12 * pulse;
            color = `rgba(255,255,255,${0.7+0.3*pulse})`;
            // Glow
            ctx.shadowColor = '#fff';
            ctx.shadowBlur = 30 * pulse;
        } else if (p.type === 'face') {
            r = 6;
            color = `rgba(100,200,255,${0.4+0.3*pulse})`;
            ctx.shadowColor = '#4af';
            ctx.shadowBlur = 10;
        } else if (p.type === 'edge') {
            r = 4;
            color = `rgba(200,100,255,${0.3+0.2*pulse})`;
            ctx.shadowColor = '#a4f';
            ctx.shadowBlur = 6;
        } else {
            r = 3;
            color = `rgba(255,100,100,${0.3+0.2*pulse})`;
            ctx.shadowColor = '#f44';
            ctx.shadowBlur = 4;
        }

        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(p.px, p.py, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Draw integration lines from center
        if (p.type !== 'center') {
            const [cpx, cpy] = proj(0,0,0);
            const alpha = (Math.sin(t * 4 + p.s[0]*2 + p.s[1]*3 + p.s[2]*5) * 0.5 + 0.5) * 0.3;
            ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
            ctx.lineWidth = 0.5;
            ctx.beginPath();
            ctx.moveTo(cpx, cpy);
            ctx.lineTo(p.px, p.py);
            ctx.stroke();
        }
    }

    // Labels
    ctx.fillStyle = '#4af';
    ctx.font = '12px Courier New';
    ctx.fillText('6 face (blue) = U(1)', W - 250, H - 100);
    ctx.fillStyle = '#a4f';
    ctx.fillText('12 edge (violet) = SU(2)', W - 250, H - 80);
    ctx.fillStyle = '#f44';
    ctx.fillText('8 corner (red) = SU(3)', W - 250, H - 60);
    ctx.fillStyle = '#fff';
    ctx.fillText('1 center (white) = observer', W - 250, H - 40);

    info.innerHTML = `
        <div>27 = 1 + 6 + 12 + 8</div>
        <div style="color:#4af">Face: nearest context</div>
        <div style="color:#a4f">Edge: intermediate</div>
        <div style="color:#f44">Corner: deepest relation</div>
        <div style="color:#fff;margin-top:4px">Center integrates all</div>
        <div style="color:#555;margin-top:6px">2^3 = 8 corners (matter)</div>
        <div style="color:#555">3^3 = 27 total (observer)</div>
    `;
}

// ============================================================
// Resonance modes visualization
// ============================================================
function drawResonanceMode() {
    const info = document.getElementById('extraInfo');
    const scale = Math.min(W, H) * 0.12;
    const n = nHarmonics;

    // Draw multiple resonance rings
    for (let k = 0; k < n; k++) {
        const freq = Math.pow(2, k);
        const amp = Math.pow(0.7, k);
        const hue = (k / n) * 280;
        const radius = (1.5 - k * 0.15) * scale;
        const nPoints = 200;

        // Standing wave on a ring
        ctx.strokeStyle = `hsla(${hue}, 80%, 60%, 0.6)`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i <= nPoints; i++) {
            const angle = (i / nPoints) * Math.PI * 2;
            const wave = amp * Math.sin(freq * angle + t * freq * 2);
            const r = radius + wave * scale * 0.3;
            const px = cx + r * Math.cos(angle);
            const py = cy + r * Math.sin(angle);
            i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.stroke();

        // Nodes (zero crossings)
        ctx.fillStyle = `hsla(${hue}, 80%, 80%, 0.8)`;
        for (let j = 0; j < freq * 2; j++) {
            const angle = (j / (freq * 2)) * Math.PI * 2 - t * 2;
            const px = cx + radius * Math.cos(angle);
            const py = cy + radius * Math.sin(angle);
            ctx.beginPath();
            ctx.arc(px, py, 3, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // Center point
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.arc(cx, cy, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    info.innerHTML = `
        <div>${n} resonant modes</div>
        <div style="color:#555;margin-top:4px">Each ring = one harmonic</div>
        <div style="color:#555">Nodes = standing wave zeros</div>
        <div style="color:#555">All commensurate (2^n)</div>
        <div style="color:#4fc;margin-top:6px">Closed = resonant</div>
        <div style="color:#555">Only resonant modes persist</div>
    `;
}

// ============================================================
// Life cycle: self-maintaining resonance
// ============================================================
function drawLifeMode() {
    const info = document.getElementById('extraInfo');
    const scale = Math.min(W, H) * 0.15;

    // The "cell": a boundary that maintains itself
    const nBoundary = 80;
    const breathe = Math.sin(t * 2) * 0.08;

    // Membrane
    ctx.strokeStyle = 'rgba(100,255,150,0.8)';
    ctx.lineWidth = 2.5;
    ctx.shadowColor = '#4f8';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    for (let i = 0; i <= nBoundary; i++) {
        const angle = (i / nBoundary) * Math.PI * 2;
        // Membrane with harmonic perturbations (multi-scale resonance)
        let r = 1.0 + breathe;
        for (let k = 0; k < nHarmonics; k++) {
            const freq = k + 2;
            const amp = 0.06 / (k + 1);
            r += amp * Math.sin(freq * angle + t * (k + 1) * 0.7);
        }
        const px = cx + r * scale * Math.cos(angle);
        const py = cy + r * scale * Math.sin(angle);
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Interior flux (metabolic cycles)
    const nFlux = 30;
    for (let i = 0; i < nFlux; i++) {
        const baseAngle = (i / nFlux) * Math.PI * 2;
        const orbitR = 0.4 + 0.3 * Math.sin(i * 2.3);
        const particleAngle = baseAngle + t * (1 + 0.5 * Math.sin(i));
        const px = cx + orbitR * scale * Math.cos(particleAngle);
        const py = cy + orbitR * scale * Math.sin(particleAngle);
        const alpha = 0.3 + 0.3 * Math.sin(t * 3 + i);
        ctx.fillStyle = `rgba(255,200,100,${alpha})`;
        ctx.beginPath();
        ctx.arc(px, py, 2, 0, Math.PI * 2);
        ctx.fill();
    }

    // Center (lambda_x)
    const centerPulse = Math.sin(t * 3) * 0.3 + 0.7;
    ctx.fillStyle = `rgba(255,255,255,${centerPulse})`;
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 25 * centerPulse;
    ctx.beginPath();
    ctx.arc(cx, cy, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Integration lines (center reading shell)
    const nLines = 12;
    for (let i = 0; i < nLines; i++) {
        const angle = (i / nLines) * Math.PI * 2;
        const phase = Math.sin(t * 4 + i * 0.5) * 0.5 + 0.5;
        const r = (1.0 + breathe) * scale;
        ctx.strokeStyle = `rgba(100,255,200,${phase * 0.3})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + r * Math.cos(angle), cy + r * Math.sin(angle));
        ctx.stroke();

        // Incoming signal dots
        const dotR = phase * r;
        ctx.fillStyle = `rgba(100,255,200,${phase * 0.5})`;
        ctx.beginPath();
        ctx.arc(cx + dotR * Math.cos(angle), cy + dotR * Math.sin(angle), 2, 0, Math.PI * 2);
        ctx.fill();
    }

    // External environment (random flux)
    for (let i = 0; i < 60; i++) {
        const angle = Math.random() * Math.PI * 2;
        const r = (1.3 + Math.random() * 1.5) * scale;
        const px = cx + r * Math.cos(angle);
        const py = cy + r * Math.sin(angle);
        ctx.fillStyle = `rgba(100,100,200,${Math.random() * 0.15})`;
        ctx.beginPath();
        ctx.arc(px, py, 1.5, 0, Math.PI * 2);
        ctx.fill();
    }

    // Feedback arrow (output sustains input)
    const arrowPhase = (t * 0.5) % (Math.PI * 2);
    const arrowR = 1.15 * scale;
    ctx.strokeStyle = 'rgba(255,150,50,0.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(cx, cy, arrowR, arrowPhase, arrowPhase + 1.5);
    ctx.stroke();
    // Arrowhead
    const ahAngle = arrowPhase + 1.5;
    const ahx = cx + arrowR * Math.cos(ahAngle);
    const ahy = cy + arrowR * Math.sin(ahAngle);
    ctx.fillStyle = 'rgba(255,150,50,0.7)';
    ctx.beginPath();
    ctx.moveTo(ahx, ahy);
    ctx.lineTo(ahx + 8 * Math.cos(ahAngle + 2.5), ahy + 8 * Math.sin(ahAngle + 2.5));
    ctx.lineTo(ahx + 8 * Math.cos(ahAngle + 0.6), ahy + 8 * Math.sin(ahAngle + 0.6));
    ctx.fill();

    info.innerHTML = `
        <div style="color:#4f8">Membrane = boundary</div>
        <div style="color:#fc8">Interior flux = metabolism</div>
        <div style="color:#fff">Center = integrative state</div>
        <div style="color:#4fc">Lines = center reads shell</div>
        <div style="color:#f94;margin-top:6px">Arrow = output sustains input</div>
        <div style="color:#555;margin-top:6px">Life = resonance that</div>
        <div style="color:#555">maintains its own resonator</div>
    `;
}

// ============================================================
// Main loop
// ============================================================
function frame() {
    // Trail effect
    ctx.fillStyle = `rgba(6,6,15,${1 - trailDecay})`;
    ctx.fillRect(0, 0, W, H);

    t += speed;

    switch (mode) {
        case 'curve': drawCurveMode(); break;
        case 'lattice': drawLatticeMode(); break;
        case 'resonance': drawResonanceMode(); break;
        case 'life': drawLifeMode(); break;
    }

    requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
