<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
  <title id="title">How to read a simulation frame</title>
  <desc id="desc">A six step sequence for reading a frame: seeded condition, toggles, fields, manifested states, diagnostics, and stability across reruns.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#315b9d"/>
    </marker>
    <filter id="shadow" x="-14%" y="-18%" width="128%" height="145%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#142033" flood-opacity="0.13"/>
    </filter>
  </defs>
  <style>
    .h{font:800 25px system-ui,Segoe UI,sans-serif;fill:#10213a}
    .p{font:500 14px system-ui,Segoe UI,sans-serif;fill:#526173}
    .card{fill:#fff;stroke-width:2;filter:url(#shadow)}
    .num{font:900 24px system-ui,Segoe UI,sans-serif;fill:#fff}
    .label{font:800 15px system-ui,Segoe UI,sans-serif;fill:#14233b}
    .small{font:500 12px system-ui,Segoe UI,sans-serif;fill:#5d6878}
    .arrow{fill:none;stroke:#315b9d;stroke-width:2.4;marker-end:url(#arrow)}
  </style>
  <rect width="1000" height="400" rx="24" fill="#fbfcff"/>
  <text class="h" x="38" y="50">Read a frame before making a claim</text>
  <text class="p" x="40" y="76">The order matters: beautiful structure is not automatically a derivation.</text>

  <g>
    <rect class="card" x="54" y="146" width="132" height="112" rx="18" stroke="#79a9e8"/>
    <circle cx="120" cy="128" r="25" fill="#477bd4"/><text class="num" x="113" y="137">1</text>
    <text class="label" x="84" y="188">Seeded?</text>
    <text class="small" x="76" y="215">what did the</text><text class="small" x="80" y="234">scenario put in?</text>
  </g>
  <g>
    <rect class="card" x="214" y="146" width="132" height="112" rx="18" stroke="#63bf95"/>
    <circle cx="280" cy="128" r="25" fill="#2f9b71"/><text class="num" x="273" y="137">2</text>
    <text class="label" x="250" y="188">Toggles?</text>
    <text class="small" x="236" y="215">which rules are</text><text class="small" x="254" y="234">active?</text>
  </g>
  <g>
    <rect class="card" x="374" y="146" width="132" height="112" rx="18" stroke="#edae55"/>
    <circle cx="440" cy="128" r="25" fill="#d98924"/><text class="num" x="433" y="137">3</text>
    <text class="label" x="412" y="188">Fields?</text>
    <text class="small" x="394" y="215">what patterns</text><text class="small" x="397" y="234">are visible?</text>
  </g>
  <g>
    <rect class="card" x="534" y="146" width="132" height="112" rx="18" stroke="#ad8ae8"/>
    <circle cx="600" cy="128" r="25" fill="#8a56d7"/><text class="num" x="593" y="137">4</text>
    <text class="label" x="564" y="188">States?</text>
    <text class="small" x="552" y="215">what actually</text><text class="small" x="552" y="234">manifested?</text>
  </g>
  <g>
    <rect class="card" x="694" y="146" width="132" height="112" rx="18" stroke="#ea7c83"/>
    <circle cx="760" cy="128" r="25" fill="#d75460"/><text class="num" x="753" y="137">5</text>
    <text class="label" x="722" y="188">Metrics?</text>
    <text class="small" x="716" y="215">what changed in</text><text class="small" x="716" y="234">diagnostics?</text>
  </g>
  <g>
    <rect class="card" x="854" y="146" width="132" height="112" rx="18" stroke="#79a9e8"/>
    <circle cx="920" cy="128" r="25" fill="#477bd4"/><text class="num" x="913" y="137">6</text>
    <text class="label" x="884" y="188">Stable?</text>
    <text class="small" x="874" y="215">does it survive</text><text class="small" x="875" y="234">reruns?</text>
  </g>

  <path class="arrow" d="M 186 202 H 208"/>
  <path class="arrow" d="M 346 202 H 368"/>
  <path class="arrow" d="M 506 202 H 528"/>
  <path class="arrow" d="M 666 202 H 688"/>
  <path class="arrow" d="M 826 202 H 848"/>

  <rect x="256" y="306" width="488" height="48" rx="16" fill="#fff4dc" stroke="#e2a244" stroke-width="2"/>
  <text class="label" x="332" y="336">Seeded, imposed, emergent, or proven elsewhere?</text>
</svg>
