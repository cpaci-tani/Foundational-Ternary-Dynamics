<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Dashboard as an experimental instrument</title>
  <desc id="desc">A dashboard mockup showing scenario selection, toggles, tick engine, viewport, diagnostics, interpretation, and rerun loop.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#315b9d"/>
    </marker>
    <filter id="shadow" x="-14%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#142033" flood-opacity="0.15"/>
    </filter>
    <radialGradient id="pulse" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#83d4ff"/>
      <stop offset="1" stop-color="#315b9d"/>
    </radialGradient>
  </defs>
  <style>
    .h{font:800 25px system-ui,Segoe UI,sans-serif;fill:#10213a}
    .p{font:500 14px system-ui,Segoe UI,sans-serif;fill:#526173}
    .panel{fill:#fff;stroke:#d3deec;stroke-width:2;filter:url(#shadow)}
    .label{font:800 15px system-ui,Segoe UI,sans-serif;fill:#14233b}
    .small{font:500 12px system-ui,Segoe UI,sans-serif;fill:#5d6878}
    .arrow{fill:none;stroke:#315b9d;stroke-width:2.4;marker-end:url(#arrow)}
  </style>
  <rect width="1000" height="560" rx="24" fill="#fbfcff"/>
  <text class="h" x="38" y="50">Use the dashboard like a lab bench</text>
  <text class="p" x="40" y="76">Change one thing, rerun, and compare what survives.</text>

  <rect class="panel" x="54" y="112" width="214" height="336" rx="20"/>
  <text class="label" x="84" y="150">Inputs</text>
  <rect x="84" y="176" width="154" height="44" rx="12" fill="#eaf2ff" stroke="#79a9e8" stroke-width="2"/>
  <text class="small" x="109" y="203">Scenario selector</text>
  <rect x="84" y="242" width="154" height="44" rx="12" fill="#eafbf1" stroke="#63bf95" stroke-width="2"/>
  <text class="small" x="121" y="269">Toggles</text>
  <rect x="84" y="308" width="154" height="44" rx="12" fill="#fff3db" stroke="#edae55" stroke-width="2"/>
  <text class="small" x="112" y="335">Parameters</text>
  <rect x="84" y="374" width="154" height="44" rx="12" fill="#f2eaff" stroke="#ad8ae8" stroke-width="2"/>
  <text class="small" x="116" y="401">Boundary</text>

  <rect class="panel" x="352" y="118" width="260" height="116" rx="20"/>
  <text class="label" x="425" y="154">Tick engine</text>
  <text class="small" x="395" y="181">local lattice loops</text>
  <text class="small" x="388" y="202">constraints, forces, motion</text>

  <rect class="panel" x="338" y="286" width="292" height="190" rx="20"/>
  <text class="label" x="374" y="324">3D viewport and overlays</text>
  <rect x="386" y="346" width="196" height="96" rx="12" fill="#0f1f34"/>
  <g stroke="#315b9d" stroke-width="1.2" opacity="0.55">
    <path d="M 416 372 H 556 M 416 398 H 556 M 416 424 H 556"/>
    <path d="M 428 358 V 436 M 468 358 V 436 M 508 358 V 436 M 548 358 V 436"/>
  </g>
  <circle cx="486" cy="398" r="32" fill="url(#pulse)" opacity="0.95"/>

  <rect class="panel" x="722" y="112" width="214" height="160" rx="20"/>
  <text class="label" x="768" y="150">Diagnostics</text>
  <rect x="762" y="174" width="128" height="10" rx="5" fill="#79a9e8"/>
  <rect x="762" y="200" width="92" height="10" rx="5" fill="#63bf95"/>
  <rect x="762" y="226" width="146" height="10" rx="5" fill="#edae55"/>

  <rect class="panel" x="706" y="330" width="246" height="118" rx="20"/>
  <text class="label" x="760" y="370">Interpretation</text>
  <text class="small" x="742" y="398">What was seeded?</text>
  <text class="small" x="742" y="418">What emerged after ticks?</text>

  <path class="arrow" d="M 268 198 H 346"/>
  <path class="arrow" d="M 484 234 V 280"/>
  <path class="arrow" d="M 614 176 H 718"/>
  <path class="arrow" d="M 632 382 H 701"/>
  <path class="arrow" d="M 829 330 V 278"/>
  <path class="arrow" d="M 706 410 C 560 520, 214 522, 162 422"/>
  <text class="small" x="330" y="103">inputs shape the run</text>
  <text class="small" x="647" y="102">measure the result</text>
  <text class="small" x="350" y="515">change one thing and rerun</text>
</svg>
