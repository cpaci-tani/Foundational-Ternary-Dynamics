<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc">
  <title id="title">Bottom-up mental model of the simulator</title>
  <desc id="desc">A chain from local voxel rules through many ticks, stable patterns, effective continuum descriptions, comparison, and honest epistemic tags.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#315b9d"/>
    </marker>
    <filter id="shadow" x="-14%" y="-18%" width="128%" height="145%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#142033" flood-opacity="0.13"/>
    </filter>
  </defs>
  <style>
    .h{font:800 25px system-ui,Segoe UI,sans-serif;fill:#10213a}
    .p{font:500 14px system-ui,Segoe UI,sans-serif;fill:#526173}
    .stage{fill:#fff;stroke-width:2.2;filter:url(#shadow)}
    .label{font:800 15px system-ui,Segoe UI,sans-serif;fill:#14233b}
    .small{font:500 12px system-ui,Segoe UI,sans-serif;fill:#5d6878}
    .arrow{fill:none;stroke:#315b9d;stroke-width:2.5;marker-end:url(#arrow)}
  </style>
  <rect width="1000" height="380" rx="24" fill="#fbfcff"/>
  <text class="h" x="38" y="50">The bottom-up mental model</text>
  <text class="p" x="40" y="76">Start with local updates. Treat smoothness as something to earn, measure, and audit.</text>

  <g>
    <rect class="stage" x="54" y="158" width="128" height="86" rx="18" stroke="#63bf95"/>
    <text class="label" x="84" y="192">Local</text><text class="label" x="78" y="214">voxel rules</text>
    <text class="small" x="81" y="235">one tick at a time</text>
  </g>
  <g>
    <rect class="stage" x="220" y="158" width="128" height="86" rx="18" stroke="#79a9e8"/>
    <text class="label" x="253" y="192">Many</text><text class="label" x="260" y="214">ticks</text>
    <text class="small" x="246" y="235">iteration matters</text>
  </g>
  <g>
    <rect class="stage" x="386" y="158" width="128" height="86" rx="18" stroke="#edae55"/>
    <text class="label" x="426" y="192">Stable</text><text class="label" x="416" y="214">patterns</text>
    <text class="small" x="414" y="235">or artifacts</text>
  </g>
  <g>
    <rect class="stage" x="552" y="158" width="148" height="86" rx="18" stroke="#ad8ae8"/>
    <text class="label" x="586" y="192">Effective</text><text class="label" x="574" y="214">continuum</text>
    <text class="small" x="583" y="235">scale-dependent</text>
  </g>
  <g>
    <rect class="stage" x="738" y="158" width="128" height="86" rx="18" stroke="#ea7c83"/>
    <text class="label" x="775" y="192">Compare</text><text class="label" x="772" y="214">physics</text>
    <text class="small" x="767" y="235">predictions, limits</text>
  </g>
  <g>
    <rect class="stage" x="886" y="158" width="88" height="86" rx="18" stroke="#79a9e8"/>
    <text class="label" x="909" y="192">Tag</text><text class="label" x="904" y="214">claim</text>
    <text class="small" x="904" y="235">honestly</text>
  </g>

  <path class="arrow" d="M 182 201 H 215"/>
  <path class="arrow" d="M 348 201 H 381"/>
  <path class="arrow" d="M 514 201 H 547"/>
  <path class="arrow" d="M 700 201 H 733"/>
  <path class="arrow" d="M 866 201 H 881"/>

  <path d="M 92 286 C 220 326, 760 326, 928 286" fill="none" stroke="#d8e2ef" stroke-width="8" stroke-linecap="round"/>
  <text class="small" x="350" y="338">The simulator is useful because it lets you inspect this chain from the bottom.</text>
</svg>
