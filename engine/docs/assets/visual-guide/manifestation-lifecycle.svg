<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
  <title id="title">Manifestation lifecycle</title>
  <desc id="desc">State transitions from void to high flux, manifested state, movement, evaporation, annihilation, and binding.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#315b9d"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#142033" flood-opacity="0.16"/>
    </filter>
    <radialGradient id="fluxGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#fff0a6"/>
      <stop offset="0.55" stop-color="#f3a95a"/>
      <stop offset="1" stop-color="#dd6b73"/>
    </radialGradient>
  </defs>
  <style>
    .h{font:800 25px system-ui,Segoe UI,sans-serif;fill:#10213a}
    .p{font:500 14px system-ui,Segoe UI,sans-serif;fill:#526173}
    .state{fill:#fff;stroke-width:2.5;filter:url(#shadow)}
    .label{font:800 17px system-ui,Segoe UI,sans-serif;fill:#14233b}
    .small{font:500 13px system-ui,Segoe UI,sans-serif;fill:#5b6675}
    .flow{fill:none;stroke:#315b9d;stroke-width:2.7;marker-end:url(#arrow)}
    .return{fill:none;stroke:#c94f63;stroke-width:2.7;marker-end:url(#arrow);stroke-dasharray:7 7}
  </style>
  <rect width="1000" height="600" rx="24" fill="#fbfcff"/>
  <text class="h" x="38" y="50">Manifestation: field capacity becomes actual state</text>
  <text class="p" x="40" y="76">The guide's visual hinge: flux can cross a threshold and create a ternary site.</text>

  <g>
    <rect class="state" x="72" y="238" width="154" height="92" rx="18" stroke="#79a9e8"/>
    <text class="label" x="122" y="276">Void</text>
    <text class="small" x="106" y="300">state = 0</text>
  </g>
  <g>
    <circle cx="360" cy="284" r="67" fill="url(#fluxGlow)" stroke="#d47b42" stroke-width="3" filter="url(#shadow)"/>
    <text class="label" x="323" y="277">High</text>
    <text class="label" x="324" y="300">flux</text>
    <text class="small" x="295" y="377">threshold candidate</text>
  </g>
  <g>
    <rect class="state" x="522" y="238" width="168" height="92" rx="18" stroke="#63bf95"/>
    <text class="label" x="558" y="276">Manifested</text>
    <text class="small" x="562" y="300">state = -1 or +1</text>
  </g>
  <g>
    <rect class="state" x="772" y="238" width="154" height="92" rx="18" stroke="#edae55"/>
    <text class="label" x="812" y="276">Moving</text>
    <text class="small" x="797" y="300">velocity registers</text>
  </g>
  <g>
    <rect class="state" x="522" y="430" width="168" height="82" rx="18" stroke="#ad8ae8"/>
    <text class="label" x="570" y="463">Locked</text>
    <text class="small" x="552" y="486">triad or composite</text>
  </g>
  <g>
    <rect class="state" x="254" y="86" width="214" height="82" rx="18" stroke="#ea7c83"/>
    <text class="label" x="306" y="119">Return to field</text>
    <text class="small" x="286" y="142">evaporation / annihilation</text>
  </g>

  <path class="flow" d="M 226 284 H 287"/>
  <path class="flow" d="M 427 284 H 518"/>
  <path class="flow" d="M 690 284 H 767"/>
  <path class="flow" d="M 849 330 C 815 391, 745 442, 694 462"/>
  <path class="flow" d="M 606 430 V 335"/>
  <path class="return" d="M 548 237 C 500 170, 430 143, 468 127"/>
  <path class="return" d="M 310 168 C 250 205, 208 223, 171 238"/>
  <path class="return" d="M 773 254 C 672 166, 574 113, 470 123"/>

  <text class="small" x="238" y="270">density rises</text>
  <text class="small" x="438" y="270">probability test</text>
  <text class="small" x="700" y="270">forces act</text>
  <text class="small" x="718" y="392">binding path</text>
  <text class="small" x="492" y="199">weak or low-energy exit</text>
</svg>
