<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FTD Test Dashboard</title>
<style>
:root {
  /* Aligned with index.html design tokens */
  --bg-deep:      #111827;
  --bg-surface:   #1f2937;
  --bg-panel:     #1f2937;   /* alias for bg-surface */
  --bg-card:      #374151;
  --bg-hover:     #4b5563;
  --text-primary: #f3f4f6;
  --text:         #f3f4f6;   /* alias for text-primary */
  --text-secondary: #9ca3af;
  --text-dim:     #9ca3af;   /* alias for text-secondary */
  --text-muted:   #8b95a5;
  --accent:       #60a5fa;
  --positive:     #4ade80;
  --negative:     #f87171;
  --warning:      #fbbf24;
  --border:       #374151;
  --radius:       6px;
  --font-mono:    'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace;
  --font-sans:    'Inter', system-ui, -apple-system, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg-deep);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
}

/* ── Header ─────────────────────────────────────── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
}

header h1 {
  font-size: 18px;
  font-weight: 600;
  color: var(--accent);
}

header .nav-links {
  display: flex;
  gap: 12px;
  align-items: center;
}

header .nav-links a {
  color: var(--text-dim);
  text-decoration: none;
  font-size: 13px;
}

header .nav-links a:hover { color: var(--accent); }

.btn {
  padding: 6px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-card);
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  transition: background 0.15s;
}

.btn:hover { background: var(--bg-hover); }
.btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
.btn.run { background: #065f46; border-color: #059669; color: var(--positive); }
.btn.run:hover { background: #047857; }
.btn.run.running { background: var(--bg-hover); color: var(--warning); cursor: default; }
.btn.stop { background: #7f1d1d; border-color: #dc2626; color: var(--negative); }
.btn.stop:hover { background: #991b1b; }

/* ── Layout ─────────────────────────────────────── */
.layout {
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 0;
  min-height: calc(100vh - 53px);
}

/* ── Sidebar ────────────────────────────────────── */
.sidebar {
  background: var(--bg-panel);
  border-right: 1px solid var(--border);
  padding: 16px;
  overflow-y: auto;
}

.summary-cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 16px;
}

.summary-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 10px;
  text-align: center;
}

.summary-card .value {
  font-size: 22px;
  font-weight: 700;
  font-family: var(--font-mono);
}

.summary-card .label {
  font-size: 11px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* ── Progress bar ───────────────────────────────── */
.progress-bar {
  height: 6px;
  background: var(--bg-card);
  border-radius: 3px;
  margin-bottom: 12px;
  overflow: hidden;
  position: relative;
}

.progress-bar .fill-pass {
  height: 100%;
  background: var(--positive);
  position: absolute;
  left: 0;
  top: 0;
  transition: width 0.3s;
}

.progress-bar .fill-fail {
  height: 100%;
  background: var(--negative);
  position: absolute;
  top: 0;
  transition: left 0.3s, width 0.3s;
}

.progress-bar .fill-active {
  height: 100%;
  background: var(--accent);
  position: absolute;
  top: 0;
  transition: left 0.3s, width 0.3s;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.progress-text {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 16px;
  display: flex;
  justify-content: space-between;
}

.sidebar h3 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-dim);
  margin-bottom: 8px;
}

.cat-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.cat-item {
  display: grid;
  grid-template-columns: 8px 1fr auto;
  gap: 8px;
  align-items: center;
  padding: 7px 8px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: background 0.1s;
  font-size: 13px;
}

.cat-item:hover { background: var(--bg-card); }
.cat-item.active { background: var(--bg-card); border-left: 2px solid var(--accent); }

.cat-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.cat-count {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-dim);
}

.meta-info {
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-dim);
}

.meta-info p { margin-bottom: 4px; }

/* ── Main content ───────────────────────────────── */
.main {
  padding: 16px 20px;
  overflow-y: auto;
}

.toolbar {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  align-items: center;
  flex-wrap: wrap;
}

.toolbar .filter-group {
  display: flex;
  gap: 0;
}

.toolbar .filter-group .btn {
  border-radius: 0;
  border-right-width: 0;
}

.toolbar .filter-group .btn:first-child { border-radius: var(--radius) 0 0 var(--radius); }
.toolbar .filter-group .btn:last-child { border-radius: 0 var(--radius) var(--radius) 0; border-right-width: 1px; }

.toolbar .spacer { flex: 1; }

/* ── Test rows ──────────────────────────────────── */
.test-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.test-row {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: border-color 0.2s;
}

.test-row.active-test {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}

.test-header {
  display: grid;
  grid-template-columns: 32px 22px 1fr auto auto;
  gap: 8px;
  align-items: center;
  padding: 6px 12px;
  cursor: pointer;
  transition: background 0.1s;
}

.test-header:hover { background: var(--bg-card); }

.test-num {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  text-align: right;
}

.test-icon {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}

.test-icon.pass { background: var(--positive); color: #000; }
.test-icon.fail { background: var(--negative); color: #000; }
.test-icon.pending { background: var(--bg-card); color: var(--text-dim); border: 1px solid var(--border); }
.test-icon.running { background: var(--accent); color: #000; animation: pulse 1s infinite; }
.test-icon.skipped { background: var(--bg-card); color: var(--text-dim); }

.test-name {
  font-family: var(--font-mono);
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.test-checks {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-dim);
  white-space: nowrap;
}

.test-duration {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-dim);
  white-space: nowrap;
  min-width: 50px;
  text-align: right;
}

.cat-tag {
  font-size: 10px;
  color: var(--text-dim);
  background: var(--bg-deep);
  padding: 1px 6px;
  border-radius: 3px;
  margin-left: 8px;
}

/* ── Live output panel ──────────────────────────── */
.test-details {
  display: none;
  border-top: 1px solid var(--border);
  background: #0d1117;
  max-height: 350px;
  overflow-y: auto;
}

.test-details.open { display: block; }

.live-output {
  padding: 8px 12px;
  font-family: var(--font-mono);
  font-size: 11px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-all;
  color: var(--text-dim);
}

.live-output .hl-pass { color: var(--positive); font-weight: 600; }
.live-output .hl-fail { color: var(--negative); font-weight: 700; background: rgba(248,113,113,0.1); display: inline; padding: 1px 4px; border-radius: 2px; }
.live-output .hl-section { color: var(--accent); font-weight: 600; }

/* ── Empty state ────────────────────────────────── */
.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-dim);
}

.empty-state h2 {
  font-size: 20px;
  margin-bottom: 12px;
  color: var(--text);
}

.empty-state code {
  display: inline-block;
  background: var(--bg-card);
  padding: 8px 16px;
  border-radius: var(--radius);
  font-family: var(--font-mono);
  font-size: 13px;
  margin-top: 12px;
  color: var(--accent);
}

/* ── Responsive ─────────────────────────────────── */
@media (max-width: 768px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { border-right: none; border-bottom: 1px solid var(--border); }
}
</style>
</head>
<body>

<header>
  <h1>FTD Test Dashboard</h1>
  <div class="nav-links">
    <a href="index.html">Simulation</a>
    <button class="btn" id="btn-load" title="Load from JSON">Load JSON</button>
    <button class="btn run" id="btn-run" title="Run tests live">Run Live</button>
    <button class="btn stop" id="btn-stop" title="Force stop all tests" style="display:none">Stop</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <!-- Populated by JS -->
  </aside>
  <main class="main" id="main">
    <!-- Populated by JS -->
  </main>
</div>

<script type="module" src="js/tests.js"></script>
</body>
</html>
