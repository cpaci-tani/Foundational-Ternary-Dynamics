<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Off-thread WASM proof</title>
<style>
  *{box-sizing:border-box}
  body{max-width:100%;margin:0;padding:20px;background:#0a0e16;color:#cde;font:16px/1.6 monospace;overflow-wrap:anywhere}
  #status{color:#7fd}.label{color:#89a}#spin{color:#fd6}
</style></head>
<body>
<h2>Serial WASM engine in a Web Worker (off the main thread)</h2>
<div><span class="label">worker:</span> <span id="status">loading…</span></div>
<div><span class="label">main-thread liveness:</span> <span id="spin">|</span> <span id="maincount">0</span>
     (must keep spinning while the engine ticks)</div>
<div><span class="label">field (sampled inside worker):</span> <span id="flux">—</span></div>
<script>
  const $ = (id) => document.getElementById(id);
  const w = new Worker('./wasm-threads-proof.worker.js', { name: '33' });
  const bootDeadline = setTimeout(() => {
    $('status').textContent = 'WORKER ERROR: startup timed out while loading the serial WASM core';
    w.terminate();
  }, 20000);
  w.onmessage = (e) => {
    const m = e.data;
    if (m.type === 'boot') {
      $('status').textContent = m.stage;
    } else if (m.type === 'ready') {
      clearTimeout(bootDeadline);
      $('status').textContent = `READY  dedicatedWorker=true  nestedPool=${m.pool}  N=${m.N}`;
    } else if (m.type === 'frame') {
      $('flux').textContent = `tick ${m.tick}  workerTickMs ${m.tickMs.toFixed(1)}  maxFlux~ ${m.maxFlux.toExponential(3)}`;
    } else if (m.type === 'error') {
      clearTimeout(bootDeadline);
      $('status').textContent = 'WORKER ERROR: ' + m.msg;
    }
  };
  w.onerror = (e) => { clearTimeout(bootDeadline); $('status').textContent = 'Worker failed: ' + (e.message || e); };
  let c = 0; const f = ['|','/','-','\\'];
  setInterval(() => { $('spin').textContent = f[c % 4]; $('maincount').textContent = (++c); }, 80);
</script>
</body></html>
