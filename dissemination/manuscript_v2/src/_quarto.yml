project:
  type: book
  output-dir: ../_book

book:
  title: "Foundational Ternary Dynamics"
  subtitle: "Deriving the Standard Model from Five Lattice Postulates"
  date: "2026"

  chapters:
    - index.qmd
    - preface.qmd

    - part: "Prolegomena"
      chapters:
        - chapters/P1-epistemic-framework.qmd
        - chapters/P2-mathematical-prerequisites.qmd

    - part: "Book I: The Lattice and Its Algebra"
      chapters:
        - chapters/01-five-postulates.qmd
        - chapters/02-two-layer-ontology.qmd
        - chapters/03-why-d-equals-3.qmd
        - chapters/04-moore-decomposition.qmd
        - chapters/05-gauge-groups.qmd
        - chapters/06-bcc-eigenvalue-watson.qmd
        - chapters/07-bridge-constant-gstar.qmd
        - chapters/08-master-quadratic.qmd

    - part: "Book II: Physical Content"
      chapters:
        - chapters/09-roots-alpha-and-nc.qmd
        - chapters/10-framework-integers.qmd
        - chapters/11-precision-formula.qmd
        - chapters/12-mass-spectrum.qmd
        - chapters/13-complete-standard-model.qmd
        - chapters/14-action-principle-forces.qmd
        - chapters/15-gravity-from-lattice.qmd
        - chapters/16-qm-from-flux.qmd
        - chapters/17-bell-tsirelson.qmd
        - chapters/18-matter-antimatter-confinement.qmd

    - part: "Book III: The Observer and the Cosmos"
      chapters:
        - chapters/19-observer-formalism.qmd
        - chapters/20-measurement.qmd
        - chapters/21-consciousness.qmd
        - chapters/22-dark-matter-energy.qmd
        - chapters/23-vacuum-energy.qmd
        - chapters/24-predictions-status.qmd

    - part: "Book IV: The Atomic Realm"
      chapters:
        - chapters/3.1-stable-structures.qmd
        - chapters/3.2-the-periodic-table.qmd
        - chapters/3.3-electron-dynamics.qmd
        - chapters/3.4-nuclear-physics.qmd

    - part: "Book V: The Molecular Realm"
      chapters:
        - chapters/4.1-chemical-bonds.qmd
        - chapters/4.2-simple-molecules.qmd
        - chapters/4.3-complex-molecules.qmd
        - chapters/4.4-macromolecules.qmd

    - part: "Book VI: States of Matter"
      chapters:
        - chapters/5.1-states-of-matter.qmd
        - chapters/5.2-phase-transitions.qmd
        - chapters/5.3-exotic-states.qmd

    - part: "Book VII: Structures and Materials"
      chapters:
        - chapters/6.1-crystal-lattices.qmd
        - chapters/6.2-metals-and-conductors.qmd
        - chapters/6.3-semiconductors.qmd
        - chapters/6.4-biological-structures.qmd

    - part: "Book VIII: The Planetary Realm"
      chapters:
        - chapters/7.1-gravity-wells.qmd
        - chapters/7.2-atmospheres.qmd
        - chapters/7.3-geology.qmd
        - chapters/7.4-magnetospheres.qmd

    - part: "Book IX: The Stellar Realm"
      chapters:
        - chapters/8.1-stellar-formation.qmd
        - chapters/8.2-main-sequence.qmd
        - chapters/8.3-stellar-nucleosynthesis.qmd
        - chapters/8.4-stellar-death.qmd
        - chapters/8.5-compact-objects.qmd

    - part: "Book X: The Galactic Realm"
      chapters:
        - chapters/9.1-galaxy-formation.qmd
        - chapters/9.2-galaxy-types.qmd
        - chapters/9.3-the-milky-way.qmd
        - chapters/9.4-galaxy-interactions.qmd

    - part: "Book XI: The Cosmic Realm"
      chapters:
        - chapters/10.1-large-scale-structure.qmd
        - chapters/10.2-dark-matter.qmd
        - chapters/10.3-dark-energy.qmd
        - chapters/10.4-cosmological-epochs.qmd

    - part: "Book XII: Extreme Phenomena"
      chapters:
        - chapters/11.1-black-holes.qmd
        - chapters/11.2-gravitational-waves.qmd
        - chapters/11.3-cosmic-rays.qmd
        - chapters/11.4-vacuum-fluctuations.qmd

    - part: "Book XIII: Emergent Phenomena"
      chapters:
        - chapters/12.0-definition-of-life.qmd
        - chapters/12.1-self-organization.qmd
        - chapters/12.1a-hierarchy-of-sentience.qmd
        - chapters/12.2-information-and-entropy.qmd
        - chapters/12.3-complexity.qmd
        - chapters/12.4-the-anthropic-window.qmd

    - part: "Book XIV: The End"
      chapters:
        - chapters/13.1-heat-death.qmd
        - chapters/13.2-alternative-endings.qmd
        - chapters/13.3-return-to-void.qmd

    - part: "Appendices"
      chapters:
        - chapters/14.1-constants-reference.qmd
        - chapters/14.2-equations-reference.qmd
        - chapters/14.3-glossary.qmd
        - chapters/14.4-particle-catalog.qmd
        - chapters/14.5-assumption-ledger.qmd
        - chapters/14.6-self-consistency.qmd
        - chapters/14.8-information-quantification.qmd
        - chapters/14.10-number-theory.qmd

    - part: "Observational Support"
      chapters:
        - chapters/15.1-observational-confirmations.qmd

bibliography: references.bib

filters:
  - ftd-callouts.lua

format:
  html:
    theme: cosmo
    css: styles.css
    include-in-header: skip-link.html
    toc: true
    toc-depth: 3
    number-sections: true
    code-fold: true

  pdf:
    documentclass: book
    classoption: [twoside, openright]
    toc: true
    toc-title: "Contents"
    toc-depth: 3
    number-sections: true
    colorlinks: true
    papersize: letter
    fontsize: 11pt
    geometry:
      - top=1in
      - bottom=1in
      - left=1.25in
      - right=1in
    linestretch: 1.4
    include-in-header:
      - preamble.tex
      - titlepage-preamble.tex
    keep-tex: true
