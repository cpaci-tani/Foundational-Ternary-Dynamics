<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FTD Theory Mindmap</title>
<!--
  Self-contained on purpose: zero CDN dependencies, zero build step.
  The predecessor (3d_theory_map.html) pulled three.js + 3d-force-graph from
  unpkg, which meant it silently died offline and could not be published as a
  CSP-restricted artifact. Everything here is vanilla canvas + JS.

  Data comes from theory_mindmap.json, generated by
  scripts/theory/build_theory_mindmap.py. Do not hand-edit either file.
-->
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#c9d1d9;
    --fg-dim:#8b949e; --accent:#58a6ff; --accent-dim:#1f6feb;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#ffffff; --panel:#f6f8fa; --border:#d0d7de; --fg:#1f2328;
           --fg-dim:#656d76; --accent:#0969da; --accent-dim:#0550ae; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #app{display:flex;height:100%}
  #side{width:310px;flex:0 0 310px;background:var(--panel);border-right:1px solid var(--border);
    display:flex;flex-direction:column;overflow:hidden}
  #side h1{font-size:15px;margin:0;padding:14px 14px 6px;letter-spacing:.2px}
  #side .sub{padding:0 14px 10px;color:var(--fg-dim);font-size:11.5px}
  .box{padding:10px 14px;border-top:1px solid var(--border)}
  .box h2{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--fg-dim);
    margin:0 0 8px;font-weight:600}
  input[type=search]{width:100%;padding:7px 9px;background:var(--bg);color:var(--fg);
    border:1px solid var(--border);border-radius:6px;font-size:13px}
  input[type=search]:focus{outline:none;border-color:var(--accent)}
  #tags{overflow-y:auto;flex:1;min-height:60px}
  .tag{display:flex;align-items:center;gap:7px;padding:2.5px 0;cursor:pointer;font-size:12px;
    user-select:none}
  .tag:hover{color:var(--accent)}
  .tag .sw{width:11px;height:11px;border-radius:3px;flex:0 0 11px}
  .tag .ct{margin-left:auto;color:var(--fg-dim);font-variant-numeric:tabular-nums;font-size:11px}
  .tag.off{opacity:.35}
  .btn{background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:6px;
    padding:5px 9px;font-size:12px;cursor:pointer}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .row{display:flex;gap:6px;flex-wrap:wrap}
  #stage{flex:1;position:relative;overflow:hidden}
  canvas{display:block;cursor:grab}
  canvas.drag{cursor:grabbing}
  #detail{position:absolute;right:14px;top:14px;width:340px;max-height:calc(100% - 28px);
    overflow-y:auto;background:var(--panel);border:1px solid var(--border);border-radius:9px;
    padding:14px;display:none;box-shadow:0 8px 28px rgba(0,0,0,.35)}
  #detail h3{margin:0 0 4px;font-size:14px;line-height:1.35}
  #detail .path{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
    color:var(--fg-dim);word-break:break-all;margin-bottom:10px}
  #detail dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12px}
  #detail dt{color:var(--fg-dim)}
  #detail dd{margin:0}
  #detail .close{position:absolute;right:10px;top:8px;cursor:pointer;color:var(--fg-dim);
    font-size:17px;line-height:1}
  #detail .close:hover{color:var(--fg)}
  .pill{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;color:#fff}
  #hint{position:absolute;left:14px;bottom:12px;color:var(--fg-dim);font-size:11.5px;
    background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:5px 9px}
  #results{max-height:190px;overflow-y:auto;margin-top:8px;font-size:12px}
  #results div{padding:4px 6px;border-radius:5px;cursor:pointer;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  #results div:hover{background:var(--bg);color:var(--accent)}
  #err{padding:18px;color:#f85149;font-family:ui-monospace,monospace;font-size:12px}
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <h1>FTD Theory Mindmap</h1>
    <div class="sub" id="stat">loading…</div>

    <div class="box">
      <h2>Search</h2>
      <input type="search" id="q" placeholder="title, path, or FTD-0123…" autocomplete="off">
      <div id="results"></div>
    </div>

    <div class="box">
      <h2>View</h2>
      <div class="row">
        <button class="btn" id="expandAll">Expand all</button>
        <button class="btn" id="collapseAll">Collapse</button>
        <button class="btn" id="reset">Reset view</button>
      </div>
      <div class="row" style="margin-top:6px">
        <label style="font-size:12px;display:flex;align-items:center;gap:6px;cursor:pointer">
          <input type="checkbox" id="showArchived"> show archived
        </label>
      </div>
    </div>

    <div class="box" style="flex:1;display:flex;flex-direction:column;min-height:0">
      <h2>Epistemic tag <span style="text-transform:none;font-weight:400">(click to filter)</span></h2>
      <div id="tags"></div>
    </div>
  </div>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="detail"><span class="close" id="dclose">&times;</span><div id="dbody"></div></div>
    <div id="hint">drag to pan · scroll to zoom · click a node to expand / inspect</div>
  </div>
</div>

<script>
const DATA_URL = 'theory_mindmap.json';

let DATA=null, DOCS={}, ADJ={}, ROOT=null, NODES=[], HIDDEN_TAGS=new Set(), SHOW_ARCHIVED=false;
let view={x:0,y:0,k:1}, drag=null, selected=null, hover=null;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');

function resize(){
  const r=cv.parentElement.getBoundingClientRect(), d=window.devicePixelRatio||1;
  cv.width=r.width*d; cv.height=r.height*d; cv.style.width=r.width+'px'; cv.style.height=r.height+'px';
  ctx.setTransform(d,0,0,d,0,0); draw();
}
window.addEventListener('resize',resize);

/* ---------- tree model ---------- */
function buildTree(){
  function wrap(n,depth){
    const o={id:n.id,kind:n.kind||'root',depth,children:[],collapsed:depth>=1,
             name:n.name||'',ref:DOCS[n.id]||null};
    (n.children||[]).forEach(c=>o.children.push(wrap(c,depth+1)));
    return o;
  }
  ROOT=wrap(DATA.tree,0);
  ROOT.collapsed=false;
  ROOT.children.forEach(s=>s.collapsed=false); // sectors open by default
}

function visible(n){
  if(n.kind==='doc'){
    const d=n.ref; if(!d) return false;
    if(!SHOW_ARCHIVED && d.archived) return false;
    if(HIDDEN_TAGS.has(d.primary_tag)) return false;
  }
  return true;
}
/* a group/sector is only worth drawing if something under it survives filters */
function hasVisibleDesc(n){
  if(n.kind==='doc') return visible(n);
  return n.children.some(c=>hasVisibleDesc(c));
}

/* ---------- radial layout ---------- */
function layout(){
  NODES=[];
  const leaves=[];
  (function count(n){
    if(!hasVisibleDesc(n)) return 0;
    if(n.kind==='doc'||n.collapsed||!n.children.length){ leaves.push(n); n._leaf=true; return 1; }
    n._leaf=false; let s=0; n.children.forEach(c=>s+=count(c)); return s;
  })(ROOT);

  const total=Math.max(leaves.length,1);
  let i=0;
  const RING=170;
  (function place(n,depth){
    if(!hasVisibleDesc(n)) return;
    if(n._leaf){
      n._a=(i/total)*Math.PI*2; i++;
    } else {
      let a0=null,a1=null;
      n.children.forEach(c=>{ if(!hasVisibleDesc(c))return; place(c,depth+1);
        if(c._a==null)return; if(a0===null||c._a<a0)a0=c._a; if(a1===null||c._a>a1)a1=c._a; });
      n._a=(a0===null)?0:(a0+a1)/2;
    }
    const r=depth*RING;
    n._x=Math.cos(n._a)*r; n._y=Math.sin(n._a)*r; n._r=r; n._depth=depth;
    NODES.push(n);
  })(ROOT,0);
  // root dead-centre
  ROOT._x=0; ROOT._y=0;
}

/* ---------- render ---------- */
function nodeColor(n){
  if(n.kind==='doc') return n.ref? n.ref.color : '#757575';
  if(n.kind==='sector') return '#58a6ff';
  if(n.kind==='group') return '#8b949e';
  return '#c9d1d9';
}
function nodeRadius(n){
  if(n.kind==='root') return 9;
  if(n.kind==='sector') return 7;
  if(n.kind==='group') return 5;
  const inb=n.ref? n.ref.inbound : 0;
  return Math.min(3+Math.sqrt(inb)*0.9, 10);
}
function label(n){
  if(n.kind==='doc') return n.ref? n.ref.stem : n.id;
  if(n.kind==='root') return 'docs/theory';
  return n.name + (n.collapsed && n.children.length? ` (${n.children.length})` : '');
}

function draw(){
  const w=cv.clientWidth,h=cv.clientHeight;
  ctx.save();
  ctx.clearRect(0,0,w,h);
  ctx.translate(w/2+view.x,h/2+view.y); ctx.scale(view.k,view.k);

  // hierarchy edges
  ctx.lineWidth=1/view.k;
  ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue('--border');
  NODES.forEach(n=>{
    if(n._leaf||n.collapsed) return;
    n.children.forEach(c=>{
      if(!hasVisibleDesc(c)||c._x==null) return;
      ctx.beginPath(); ctx.moveTo(n._x,n._y); ctx.lineTo(c._x,c._y); ctx.stroke();
    });
  });

  // cross-links, only for the selected doc (drawing 4k edges at once is mush)
  if(selected && selected.kind==='doc' && selected.ref){
    const pos={}; NODES.forEach(n=>{ if(n.kind==='doc'&&n.ref) pos[n.ref.id]=n; });
    ctx.strokeStyle='rgba(88,166,255,.55)'; ctx.lineWidth=1.4/view.k;
    (ADJ[selected.ref.id]||[]).forEach(t=>{
      const p=pos[t]; if(!p) return;
      ctx.beginPath(); ctx.moveTo(selected._x,selected._y); ctx.lineTo(p._x,p._y); ctx.stroke();
    });
  }

  // nodes
  NODES.forEach(n=>{
    if(n._x==null) return;
    const r=nodeRadius(n);
    ctx.beginPath(); ctx.arc(n._x,n._y,r,0,Math.PI*2);
    ctx.fillStyle=nodeColor(n); ctx.fill();
    if(n===selected||n===hover){
      ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue('--accent');
      ctx.lineWidth=2.2/view.k; ctx.stroke();
    }
  });

  // labels (suppressed when zoomed out so it stays readable)
  ctx.textBaseline='middle';
  NODES.forEach(n=>{
    if(n._x==null) return;
    const isStruct=n.kind!=='doc';
    if(!isStruct && view.k<0.55) return;
    if(isStruct===false && view.k<0.8 && n!==hover && n!==selected) return;
    ctx.save();
    ctx.font=(isStruct? '600 ':'')+(isStruct?12:10.5)/view.k*1+'px -apple-system,Segoe UI,Roboto,sans-serif';
    ctx.fillStyle=isStruct? getComputedStyle(document.body).getPropertyValue('--fg')
                          : getComputedStyle(document.body).getPropertyValue('--fg-dim');
    const r=nodeRadius(n)+4/1;
    const flip=Math.cos(n._a||0)<0 && n._depth>0;
    ctx.translate(n._x,n._y);
    ctx.rotate(n._a||0);
    if(flip){ ctx.rotate(Math.PI); ctx.textAlign='right'; ctx.fillText(label(n),-r,0); }
    else { ctx.textAlign='left'; ctx.fillText(label(n),r,0); }
    ctx.restore();
  });

  ctx.restore();
}

/* ---------- hit testing ---------- */
function pick(mx,my){
  const w=cv.clientWidth,h=cv.clientHeight;
  const x=(mx-w/2-view.x)/view.k, y=(my-h/2-view.y)/view.k;
  let best=null,bd=1e9;
  NODES.forEach(n=>{
    if(n._x==null) return;
    const d=Math.hypot(n._x-x,n._y-y), rr=nodeRadius(n)+6;
    if(d<rr && d<bd){ bd=d; best=n; }
  });
  return best;
}

/* ---------- interaction ---------- */
cv.addEventListener('mousedown',e=>{ drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,moved:false};
  cv.classList.add('drag'); });
window.addEventListener('mousemove',e=>{
  if(drag){
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if(Math.abs(dx)+Math.abs(dy)>3) drag.moved=true;
    view.x=drag.vx+dx; view.y=drag.vy+dy; draw(); return;
  }
  const r=cv.getBoundingClientRect();
  const h2=pick(e.clientX-r.left,e.clientY-r.top);
  if(h2!==hover){ hover=h2; cv.style.cursor=h2?'pointer':'grab'; draw(); }
});
window.addEventListener('mouseup',e=>{
  if(drag && !drag.moved){
    const r=cv.getBoundingClientRect();
    const n=pick(e.clientX-r.left,e.clientY-r.top);
    if(n) activate(n);
  }
  drag=null; cv.classList.remove('drag');
});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const f=e.deltaY<0?1.12:1/1.12;
  const r=cv.getBoundingClientRect(), mx=e.clientX-r.left-cv.clientWidth/2, my=e.clientY-r.top-cv.clientHeight/2;
  view.x=mx-(mx-view.x)*f; view.y=my-(my-view.y)*f;
  view.k=Math.max(0.12,Math.min(6,view.k*f)); draw();
},{passive:false});

function activate(n){
  if(n.kind!=='doc'){ n.collapsed=!n.collapsed; layout(); draw(); return; }
  selected=n; showDetail(n.ref); draw();
}

function showDetail(d){
  if(!d) return;
  const el=document.getElementById('detail'), b=document.getElementById('dbody');
  const rel='../../'+d.path;
  b.innerHTML=`
    <h3>${esc(d.title)}</h3>
    <div class="path">${esc(d.path)}</div>
    <dl>
      <dt>tag</dt><dd><span class="pill" style="background:${d.color}">${esc(d.primary_tag)}</span></dd>
      ${d.tags.length>1?`<dt>all</dt><dd>${d.tags.map(esc).join(', ')}</dd>`:''}
      <dt>sector</dt><dd>${esc(d.sector_label)}</dd>
      <dt>group</dt><dd>${esc(d.group)}</dd>
      <dt>links</dt><dd>${d.outbound} out · ${d.inbound} in</dd>
      ${d.ftd_ids.length?`<dt>LEDGER</dt><dd>${d.ftd_ids.slice(0,10).map(esc).join(', ')}${d.ftd_ids.length>10?'…':''}</dd>`:''}
      ${d.archived?`<dt>state</dt><dd><b>archived</b></dd>`:''}
      <dt>size</dt><dd>${(d.bytes/1024).toFixed(1)} KB</dd>
    </dl>
    ${d.tag_raw?`<div style="margin-top:9px;font-size:11.5px;color:var(--fg-dim)">
       <b>raw:</b> ${esc(d.tag_raw.slice(0,240))}</div>`:''}
    <div style="margin-top:11px"><a href="${esc(rel)}" style="color:var(--accent)">open document →</a></div>`;
  el.style.display='block';
}
document.getElementById('dclose').onclick=()=>{document.getElementById('detail').style.display='none';};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ---------- search ---------- */
document.getElementById('q').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase();
  const box=document.getElementById('results');
  if(q.length<2){ box.innerHTML=''; return; }
  const hits=DATA.documents.filter(d=>
    d.title.toLowerCase().includes(q)||d.path.toLowerCase().includes(q)||
    d.ftd_ids.some(i=>i.toLowerCase().includes(q))).slice(0,40);
  box.innerHTML=hits.map(d=>`<div data-id="${esc(d.id)}" title="${esc(d.path)}">${esc(d.stem)}</div>`).join('')
    ||'<div style="color:var(--fg-dim);cursor:default">no match</div>';
  box.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>focusDoc(el.dataset.id));
});

function focusDoc(id){
  // open every ancestor so the node is actually on-screen
  (function open(n){
    if(n.kind==='doc') return n.id===id;
    let found=false;
    n.children.forEach(c=>{ if(open(c)){ n.collapsed=false; found=true; } });
    return found;
  })(ROOT);
  const d=DOCS[id];
  if(d && d.archived && !SHOW_ARCHIVED){
    SHOW_ARCHIVED=true; document.getElementById('showArchived').checked=true;
  }
  if(d) HIDDEN_TAGS.delete(d.primary_tag), renderTags();
  layout();
  const n=NODES.find(x=>x.kind==='doc'&&x.id===id);
  if(n){ selected=n; view.k=1.15; view.x=-n._x*view.k; view.y=-n._y*view.k; showDetail(n.ref); }
  draw();
}

/* ---------- tag filter ---------- */
function renderTags(){
  const box=document.getElementById('tags');
  const counts=DATA.tag_counts;
  box.innerHTML=Object.entries(counts).map(([t,c])=>{
    const col=DATA.epistemic_colors[t]||'#757575';
    return `<div class="tag ${HIDDEN_TAGS.has(t)?'off':''}" data-t="${esc(t)}">
      <span class="sw" style="background:${col}"></span><span>${esc(t)}</span><span class="ct">${c}</span></div>`;
  }).join('');
  box.querySelectorAll('[data-t]').forEach(el=>el.onclick=()=>{
    const t=el.dataset.t;
    HIDDEN_TAGS.has(t)?HIDDEN_TAGS.delete(t):HIDDEN_TAGS.add(t);
    renderTags(); layout(); draw();
  });
}

/* ---------- controls ---------- */
document.getElementById('expandAll').onclick=()=>{
  (function w(n){ n.collapsed=false; n.children.forEach(w); })(ROOT); layout(); draw(); };
document.getElementById('collapseAll').onclick=()=>{
  (function w(n){ if(n.depth>=1) n.collapsed=true; n.children.forEach(w); })(ROOT);
  ROOT.collapsed=false; layout(); draw(); };
document.getElementById('reset').onclick=()=>{ view={x:0,y:0,k:1}; selected=null;
  document.getElementById('detail').style.display='none'; draw(); };
document.getElementById('showArchived').onchange=e=>{ SHOW_ARCHIVED=e.target.checked; layout(); draw(); };

/* ---------- boot ---------- */
fetch(DATA_URL).then(r=>{ if(!r.ok) throw new Error(r.status+' '+r.statusText); return r.json(); })
.then(j=>{
  DATA=j; j.documents.forEach(d=>DOCS[d.id]=d);
  // edges[] is the single source of truth for the link graph; build the
  // outbound adjacency map once here rather than storing it twice on disk.
  j.edges.forEach(e=>{ (ADJ[e.source]=ADJ[e.source]||[]).push(e.target); });
  const s=j.stats;
  document.getElementById('stat').textContent=
    `${s.documents_active} active · ${s.documents_archived} archived · ${s.sectors} sectors · ${s.cross_edges} links`;
  buildTree(); renderTags(); layout(); resize();
})
.catch(err=>{
  document.body.innerHTML=`<div id="err">Could not load <b>${DATA_URL}</b>: ${esc(err.message)}
  <br><br>This page reads a generated file. Produce it with:
  <br><br>&nbsp;&nbsp;python scripts/theory/build_theory_mindmap.py
  <br><br>Then serve this directory over HTTP (fetch() is blocked on file:// by CORS):
  <br><br>&nbsp;&nbsp;python -m http.server 8009 -d dissemination/interactive
  <br>&nbsp;&nbsp;then open http://localhost:8009/theory_mindmap.html</div>`;
});
</script>
</body>
</html>
