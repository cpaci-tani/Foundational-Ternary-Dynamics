<body>
<h1>SINGLE PHOTON SOURCE &mdash; SCIENTIFIC SIMULATION</h1>
<p class="subtitle">Huygens-Fresnel diffraction &middot; WebGPU accelerated &middot; c = 1/&radic;3</p>
<div id="gpuStatus"></div>

<div class="toolbar">

        <label>K<sub>B</sub> threshold <input type="range" id="pKB" min="0.005" max="0.5" step="0.005" value="0.05"> <span class="pval" id="vKB">0.05</span></label>

<div class="legend" id="legend">

<script>
// ============================================================
// Configuration
// ============================================================
const W = 720, H = 720;
const C_SPEED = 1.0 / Math.sqrt(3.0);
const TWO_PI = 2.0 * Math.PI;
const SOURCE_X = W * 0.22, SOURCE_Y = H * 0.5;
const FIELD_SIZE = W * H;

// ============================================================
// State
// ============================================================
let mode = 0; // 0=psi,1=re,2=im,3=psi2,4=born,5=dots,6=ternary
let simTime = 0;
let frameCount = 0;
let useGPU = false;
let lambda = 32, nWavelengths = 1, spectralWidth = 0;
let kbThreshold = 0.05, photonRate = 20;

let detectorDots = [];
let probField = null; // cached |psi|^2 for rejection sampling
let probFieldDirty = true;
let recording = false;
let recordedFrames = [];
let wtActive = false, wtStep = 0;

// CPU field arrays (for fallback and analytics)
let cpuRe = new Float32Array(FIELD_SIZE);
let cpuIm = new Float32Array(FIELD_SIZE);
let midRe = new Float32Array(W);
let midIm = new Float32Array(W);

// GPU resources
let gpuDevice, gpuCtx, gpuCanvasFormat;
let computePipeline, renderPipeline;
let computeBindGroup, renderBindGroup;
let uniformBuf, renderUniformBuf;
let fieldReBuf, fieldImBuf, stagingBuf;
let readbackPending = false;

// Canvases
const mainCanvas = document.getElementById('mainCanvas');
const overlayCanvas = document.getElementById('overlayCanvas');
const overlayCtx = overlayCanvas.getContext('2d');
let ctx2d = null; // Only used in CPU fallback

// ============================================================
// WGSL Compute Shader
// ============================================================
const COMPUTE_WGSL = `
struct Params {
  width: u32, height: u32, n_sources: u32, n_wavelengths: u32,
  time: f32, c_speed: f32, time_scale: f32, _pad: f32,
  sources: array<vec4<f32>, 4>,
  wavelengths: array<vec4<f32>, 20>,
};
@group(0) @binding(0) var<uniform> p: Params;
@group(0) @binding(1) var<storage, read_write> fre: array<f32>;
@group(0) @binding(2) var<storage, read_write> fim: array<f32>;

@compute @workgroup_size(16, 16)
fn main(@builtin(global_invocation_id) gid: vec3u) {
  let px = gid.x; let py = gid.y;
  if (px >= p.width || py >= p.height) { return; }
  let idx = py * p.width + px;
  var re: f32 = 0.0; var im: f32 = 0.0;
  for (var s = 0u; s < p.n_sources; s++) {
    let sx = p.sources[s].x; let sy = p.sources[s].y;
    let phi_s = p.sources[s].z;
    let dx = f32(px) - sx; let dy = f32(py) - sy;
    let r = max(sqrt(dx*dx + dy*dy), 0.5);
    if (r < 2.0) { continue; }
    let front = p.c_speed * p.time;
    let causal = smoothstep(0.0, 8.0, front - r);
    if (causal < 0.001) { continue; }
    for (var n = 0u; n < p.n_wavelengths; n++) {
      let k = p.wavelengths[n].x;
      let w = p.wavelengths[n].y;
      let omega = p.c_speed * k;
      let phase = k * r - omega * p.time + phi_s;
      let envelope = w * causal / sqrt(r);
      re += envelope * cos(phase);
      im += envelope * sin(phase);
    }
  }
  fre[idx] = re;
  fim[idx] = im;
}
`;

// ============================================================
// WGSL Render Shader
// ============================================================
const RENDER_WGSL = `
struct RParams { width: u32, height: u32, mode: u32, kb: f32, };
@group(0) @binding(0) var<uniform> rp: RParams;
@group(0) @binding(1) var<storage, read> fre: array<f32>;
@group(0) @binding(2) var<storage, read> fim: array<f32>;

fn phase_rgb(th: f32) -> vec3f {
  let h = ((th / 6.28318530718) % 1.0 + 1.0) % 1.0;
  let hi = u32(h * 6.0) % 6u;
  let f = h * 6.0 - f32(hi);
  let q = 1.0 - f;
  switch hi {
    case 0u: { return vec3f(1.0, f, 0.0); }
    case 1u: { return vec3f(q, 1.0, 0.0); }
    case 2u: { return vec3f(0.0, 1.0, f); }
    case 3u: { return vec3f(0.0, q, 1.0); }
    case 4u: { return vec3f(f, 0.0, 1.0); }
    case 5u: { return vec3f(1.0, 0.0, q); }
    default: { return vec3f(0.0); }
  }
}

fn diverging(v: f32) -> vec3f {
  let c = clamp(v, -1.0, 1.0);
  if (c >= 0.0) { return mix(vec3f(0.92,0.92,0.96), vec3f(0.85,0.15,0.12), c); }
  else { return mix(vec3f(0.92,0.92,0.96), vec3f(0.12,0.15,0.85), -c); }
}

@vertex fn vs(@builtin(vertex_index) v: u32) -> @builtin(position) vec4f {
  var pos = array<vec2f,3>(vec2f(-1,-1), vec2f(3,-1), vec2f(-1,3));
  return vec4f(pos[v], 0, 1);
}

@fragment fn fs(@builtin(position) pos: vec4f) -> @location(0) vec4f {
  let px = u32(pos.x); let py = u32(pos.y);
  if (px >= rp.width || py >= rp.height) { return vec4f(0.039,0.039,0.059,1); }
  let idx = py * rp.width + px;
  let re = fre[idx]; let im = fim[idx];
  let amp = sqrt(re*re + im*im);
  let ph = atan2(im, re);
  var c: vec3f;
  switch rp.mode {
    case 0u: { // Full psi
      let rgb = phase_rgb(ph);
      c = rgb * pow(min(1.0, amp * 5.0), 0.5);
    }
    case 1u: { c = diverging(re * 3.0); } // Re
    case 2u: { c = diverging(im * 3.0); } // Im
    case 3u: { // psi^2
      let rgb = phase_rgb(ph * 2.0);
      c = rgb * pow(min(1.0, amp*amp * 20.0), 0.5);
    }
    case 4u: { // |psi|^2
      let b = pow(min(1.0, amp*amp * 40.0), 0.4);
      c = vec3f(b);
    }
    case 5u: { c = vec3f(0.039, 0.039, 0.059); } // dots: black bg
    case 6u: { // ternary
      if (amp > rp.kb) {
        if (re > 0.0) { c = vec3f(0.85, 0.18, 0.12); }
        else { c = vec3f(0.12, 0.18, 0.85); }
      } else { c = vec3f(0.02, 0.02, 0.03); }
    }
    default: { c = vec3f(0.0); }
  }
  return vec4f(c, 1.0);
}
`;

// ============================================================
// WebGPU Initialization
// ============================================================
async function initGPU() {
  if (!navigator.gpu) return false;
  try {
    const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
    if (!adapter) return false;
    gpuDevice = await adapter.requestDevice();
    gpuCanvasFormat = navigator.gpu.getPreferredCanvasFormat();
    gpuCtx = mainCanvas.getContext('webgpu');
    gpuCtx.configure({ device: gpuDevice, format: gpuCanvasFormat, alphaMode: 'premultiplied' });

    // Compute pipeline
    const compModule = gpuDevice.createShaderModule({ code: COMPUTE_WGSL });
    computePipeline = gpuDevice.createComputePipeline({ layout: 'auto', compute: { module: compModule, entryPoint: 'main' } });

    // Render pipeline
    const rendModule = gpuDevice.createShaderModule({ code: RENDER_WGSL });
    renderPipeline = gpuDevice.createRenderPipeline({
      layout: 'auto',
      vertex: { module: rendModule, entryPoint: 'vs' },
      fragment: { module: rendModule, entryPoint: 'fs', targets: [{ format: gpuCanvasFormat }] },
      primitive: { topology: 'triangle-list' },
    });

    // Buffers
    const paramSize = 32 + 4*16 + 20*16; // 416 bytes
    uniformBuf = gpuDevice.createBuffer({ size: paramSize, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
    renderUniformBuf = gpuDevice.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
    const fieldBytes = FIELD_SIZE * 4;
    fieldReBuf = gpuDevice.createBuffer({ size: fieldBytes, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
    fieldImBuf = gpuDevice.createBuffer({ size: fieldBytes, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
    const midlineBytes = W * 4 * 2; // Re + Im for one row
    stagingBuf = gpuDevice.createBuffer({ size: midlineBytes, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });

    // Bind groups
    computeBindGroup = gpuDevice.createBindGroup({
      layout: computePipeline.getBindGroupLayout(0),
      entries: [
        { binding: 0, resource: { buffer: uniformBuf } },
        { binding: 1, resource: { buffer: fieldReBuf } },
        { binding: 2, resource: { buffer: fieldImBuf } },
      ]
    });
    renderBindGroup = gpuDevice.createBindGroup({
      layout: renderPipeline.getBindGroupLayout(0),
      entries: [
        { binding: 0, resource: { buffer: renderUniformBuf } },
        { binding: 1, resource: { buffer: fieldReBuf } },
        { binding: 2, resource: { buffer: fieldImBuf } },
      ]
    });

    return true;
  } catch (e) {
    console.warn('WebGPU init failed:', e);
    return false;
  }
}

// ============================================================
// Wavelength Configuration
// ============================================================
function getWavelengths() {
  const wls = [];
  if (nWavelengths === 1 || spectralWidth === 0) {
    wls.push({ k: TWO_PI / lambda, weight: 1.0 });
  } else {
    for (let i = 0; i < nWavelengths; i++) {
      const t = (i / (nWavelengths - 1)) - 0.5; // -0.5 to 0.5
      const dl = t * spectralWidth * lambda;
      const lam = lambda + dl;
      const gaussW = Math.exp(-2 * t * t); // Gaussian spectral envelope
      wls.push({ k: TWO_PI / lam, weight: gaussW });
    }
    // Normalize weights
    const sum = wls.reduce((a, w) => a + w.weight, 0);
    wls.forEach(w => w.weight /= sum);
  }
  return wls;
}

// ============================================================
// GPU Uniform Update
// ============================================================
function writeGPUUniforms() {
  const wls = getWavelengths();
  const data = new ArrayBuffer(416);
  const u32 = new Uint32Array(data);
  const f32 = new Float32Array(data);

  u32[0] = W; u32[1] = H; u32[2] = 1; u32[3] = wls.length;
  f32[4] = simTime; f32[5] = C_SPEED; f32[6] = 1.0; f32[7] = 0;
  // Source 0 at offset 32 (f32 index 8)
  f32[8] = SOURCE_X; f32[9] = SOURCE_Y; f32[10] = 0; f32[11] = 1;
  // Wavelengths at offset 96 (f32 index 24)
  for (let i = 0; i < 20; i++) {
    const off = 24 + i * 4;
    f32[off] = i < wls.length ? wls[i].k : 0;
    f32[off+1] = i < wls.length ? wls[i].weight : 0;
    f32[off+2] = 0; f32[off+3] = 0;
  }
  gpuDevice.queue.writeBuffer(uniformBuf, 0, data);

  // Render uniforms
  const rd = new ArrayBuffer(16);
  const ru = new Uint32Array(rd);
  const rf = new Float32Array(rd);
  ru[0] = W; ru[1] = H; ru[2] = mode; rf[3] = kbThreshold;
  gpuDevice.queue.writeBuffer(renderUniformBuf, 0, rd);
}

// ============================================================
// GPU Render
// ============================================================
function renderGPU() {
  writeGPUUniforms();
  const encoder = gpuDevice.createCommandEncoder();

  // Compute pass
  const comp = encoder.beginComputePass();
  comp.setPipeline(computePipeline);
  comp.setBindGroup(0, computeBindGroup);
  comp.dispatchWorkgroups(Math.ceil(W/16), Math.ceil(H/16));
  comp.end();

  // Render pass
  const textureView = gpuCtx.getCurrentTexture().createView();
  const rp = encoder.beginRenderPass({
    colorAttachments: [{ view: textureView, clearValue: {r:0.039,g:0.039,b:0.059,a:1}, loadOp:'clear', storeOp:'store' }]
  });
  rp.setPipeline(renderPipeline);
  rp.setBindGroup(0, renderBindGroup);
  rp.draw(3);
  rp.end();

  // Midline readback (every 4 frames, when not pending)
  const doReadback = !readbackPending && frameCount % 4 === 0;
  if (doReadback) {
    const midRow = Math.floor(H / 2);
    const rowBytes = W * 4;
    const offset = midRow * rowBytes;
    encoder.copyBufferToBuffer(fieldReBuf, offset, stagingBuf, 0, rowBytes);
    encoder.copyBufferToBuffer(fieldImBuf, offset, stagingBuf, rowBytes, rowBytes);
  }

  gpuDevice.queue.submit([encoder.finish()]);

  if (doReadback) {
    readbackPending = true;
    stagingBuf.mapAsync(GPUMapMode.READ).then(() => {
      const mapped = new Float32Array(stagingBuf.getMappedRange());
      midRe.set(mapped.subarray(0, W));
      midIm.set(mapped.subarray(W, W * 2));
      stagingBuf.unmap();
      readbackPending = false;
    }).catch(() => { readbackPending = false; });
  }
}

// ============================================================
// CPU Fallback
// ============================================================
function renderCPU() {
  if (!ctx2d) ctx2d = mainCanvas.getContext('2d');
  const imgData = ctx2d.createImageData(W, H);
  const pixels = imgData.data;
  const step = 3;
  const wls = getWavelengths();

  for (let py = 0; py < H; py += step) {
    for (let px = 0; px < W; px += step) {
      const dx = px - SOURCE_X, dy = py - SOURCE_Y;
      const r = Math.max(Math.sqrt(dx*dx + dy*dy), 0.5);
      let re = 0, im = 0;
      if (r >= 2) {
        const front = C_SPEED * simTime;
        const causal = smoothstepJS(0, 8, front - r);
        if (causal > 0.001) {
          for (const wl of wls) {
            const omega = C_SPEED * wl.k;
            const phase = wl.k * r - omega * simTime;
            const env = wl.weight * causal / Math.sqrt(r);
            re += env * Math.cos(phase);
            im += env * Math.sin(phase);
          }
        }
      }
      // Store in CPU arrays
      const idx = py * W + px;
      cpuRe[idx] = re; cpuIm[idx] = im;
      // Colormap
      const [cr, cg, cb] = colormapJS(re, im);
      for (let sy = 0; sy < step && py+sy < H; sy++) {
        for (let sx = 0; sx < step && px+sx < W; sx++) {
          const pi = ((py+sy) * W + (px+sx)) * 4;
          pixels[pi] = cr; pixels[pi+1] = cg; pixels[pi+2] = cb; pixels[pi+3] = 255;
        }
      }
    }
  }
  ctx2d.putImageData(imgData, 0, 0);
  // Fill midline arrays for analytics
  const midRow = Math.floor(H / 2);
  for (let x = 0; x < W; x++) {
    midRe[x] = cpuRe[midRow * W + x];
    midIm[x] = cpuIm[midRow * W + x];
  }
}

function smoothstepJS(lo, hi, x) {
  const t = Math.max(0, Math.min(1, (x - lo) / (hi - lo)));
  return t * t * (3 - 2 * t);
}

// ============================================================
// CPU Colormap
// ============================================================
function phaseToRGB(theta) {
  const h = ((theta / TWO_PI) % 1 + 1) % 1;
  const hi = Math.floor(h * 6) % 6;
  const f = h * 6 - Math.floor(h * 6);
  const q = 1 - f;
  switch (hi) {
    case 0: return [1, f, 0];
    case 1: return [q, 1, 0];
    case 2: return [0, 1, f];
    case 3: return [0, q, 1];
    case 4: return [f, 0, 1];
    case 5: return [1, 0, q];
  }
  return [0,0,0];
}

function colormapJS(re, im) {
  const amp = Math.sqrt(re*re + im*im);
  const ph = Math.atan2(im, re);
  let cr, cg, cb;
  switch (mode) {
    case 0: { // full psi
      const [pr,pg,pb] = phaseToRGB(ph);
      const b = Math.pow(Math.min(1, amp*5), 0.5);
      cr = pr*b*255|0; cg = pg*b*255|0; cb = pb*b*255|0; break;
    }
    case 1: { // Re
      const v = Math.max(-1, Math.min(1, re*3));
      if (v >= 0) { cr = 235*(1-v)+217*v|0; cg = 235*(1-v)+38*v|0; cb = 245*(1-v)+31*v|0; }
      else { cr = 235*(1+v)+31*(-v)|0; cg = 235*(1+v)+38*(-v)|0; cb = 245*(1+v)+217*(-v)|0; }
      break;
    }
    case 2: { // Im (same diverging map)
      const v = Math.max(-1, Math.min(1, im*3));
      if (v >= 0) { cr = 235*(1-v)+217*v|0; cg = 235*(1-v)+38*v|0; cb = 245*(1-v)+31*v|0; }
      else { cr = 235*(1+v)+31*(-v)|0; cg = 235*(1+v)+38*(-v)|0; cb = 245*(1+v)+217*(-v)|0; }
      break;
    }
    case 3: { // psi^2
      const [pr,pg,pb] = phaseToRGB(ph * 2);
      const b = Math.pow(Math.min(1, amp*amp*20), 0.5);
      cr = pr*b*255|0; cg = pg*b*255|0; cb = pb*b*255|0; break;
    }
    case 4: { // |psi|^2
      const b = Math.pow(Math.min(1, amp*amp*40), 0.4);
      cr = cg = cb = b*255|0; break;
    }
    case 5: cr = 10; cg = 10; cb = 15; break; // dots bg
    case 6: { // ternary
      if (amp > kbThreshold) {
        if (re > 0) { cr = 217; cg = 46; cb = 31; }
        else { cr = 31; cg = 46; cb = 217; }
      } else { cr = 5; cg = 5; cb = 8; }
      break;
    }
    default: cr = cg = cb = 0;
  }
  return [cr, cg, cb];
}

// ============================================================
// Overlay Rendering (source, phase wheel, labels)
// ============================================================
function renderOverlay() {
  const ctx = overlayCtx;
  ctx.clearRect(0, 0, W, H);

  // Source marker
  ctx.beginPath();
  ctx.arc(SOURCE_X, SOURCE_Y, 5, 0, TWO_PI);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(SOURCE_X, SOURCE_Y, 9, 0, TWO_PI);
  ctx.strokeStyle = 'rgba(100,150,200,0.4)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.font = '10px monospace';
  ctx.fillStyle = 'rgba(160,184,216,0.6)';
  ctx.fillText('source', SOURCE_X - 16, SOURCE_Y + 22);

  // Phase wheel (bottom-left)
  if (mode === 0 || mode === 3) {
    const cx = 50, cy = H - 50, r = 28;
    for (let a = 0; a < TWO_PI; a += 0.15) {
      const [pr, pg, pb] = phaseToRGB(a);
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, -a, -a - 0.2, true);
      ctx.closePath();
      ctx.fillStyle = `rgb(${pr*200|0},${pg*200|0},${pb*200|0})`;
      ctx.fill();
    }
    // Rotating needle (global phase)
    const wls = getWavelengths();
    const omega = C_SPEED * wls[0].k;
    const needleAngle = -(omega * simTime) % TWO_PI;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + r * Math.cos(needleAngle), cy + r * Math.sin(needleAngle));
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx, cy, 3, 0, TWO_PI);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.font = '9px monospace';
    ctx.fillStyle = 'rgba(160,184,216,0.5)';
    ctx.fillText('phase', cx - 14, cy + r + 14);
  }

  // Detector dots
  if (mode === 5) {
    for (const dot of detectorDots) {
      ctx.beginPath();
      ctx.arc(dot.x, dot.y, 1.2, 0, TWO_PI);
      ctx.fillStyle = `rgba(200,220,255,${dot.a})`;
      ctx.fill();
    }
  }

  // Midline indicator
  if (mode !== 5) {
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(0, H/2);
    ctx.lineTo(W, H/2);
    ctx.strokeStyle = 'rgba(160,184,216,0.12)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

// ============================================================
// Detector Mode
// ============================================================
function addDetectorDots() {
  // Build probability field from midline if not cached
  if (probFieldDirty || !probField) {
    // Use current midline to estimate the full-field distribution
    // For a point source the pattern is rotationally symmetric
    probField = new Float32Array(W * H);
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const dx = x - SOURCE_X, dy = y - SOURCE_Y;
        const r = Math.max(Math.sqrt(dx*dx + dy*dy), 1);
        if (r < 3) { probField[y*W+x] = 0; continue; }
        // 1/r^2 falloff with causal mask
        const front = C_SPEED * simTime;
        const c = smoothstepJS(0, 8, front - r);
        probField[y*W+x] = c / r;
      }
    }
    probFieldDirty = false;
  }
  // Rejection sampling
  const maxProb = 1.0 / 3.0; // |1/sqrt(r)|^2 = 1/r, at r=3
  for (let i = 0; i < photonRate; i++) {
    let attempts = 0;
    while (attempts < 100) {
      attempts++;
      const x = Math.random() * W;
      const y = Math.random() * H;
      const ix = Math.floor(x), iy = Math.floor(y);
      if (ix < 0 || ix >= W || iy < 0 || iy >= H) continue;
      const p = probField[iy * W + ix];
      if (Math.random() < p / maxProb) {
        detectorDots.push({ x, y, a: 0.3 + Math.random() * 0.7 });
        break;
      }
    }
  }
}

// ============================================================
// Analytics
// ============================================================
function updateAnalytics() {
  document.getElementById('mFrame').textContent = frameCount;

  // Compute metrics from midline
  let imax = 0, imin = Infinity, energy = 0;
  const intensities = new Float32Array(W);
  const phases = new Float32Array(W);
  for (let x = 0; x < W; x++) {
    const re = midRe[x], im = midIm[x];
    const I = re*re + im*im;
    intensities[x] = I;
    phases[x] = Math.atan2(im, re);
    if (I > imax) imax = I;
    if (I < imin && x > SOURCE_X + 20) imin = I; // skip near source
    energy += I;
  }
  document.getElementById('mEnergy').textContent = energy.toFixed(1);
  document.getElementById('mImax').textContent = imax.toFixed(4);
  document.getElementById('mDots').textContent = detectorDots.length;

  // Intensity profile plot
  drawLinePlot('intensityPlot', intensities, '#5588cc', 'I(x)', imax);

  // Phase profile plot
  drawLinePlot('phasePlot', phases, '#cc8855', 'arg(ψ)', Math.PI, -Math.PI);

  // Record if logging
  if (recording) {
    recordedFrames.push({
      frame: frameCount,
      time: simTime,
      midline_re: Array.from(midRe),
      midline_im: Array.from(midIm),
    });
  }
}

function drawLinePlot(canvasId, data, color, label, ymax, ymin) {
  const c = document.getElementById(canvasId);
  const ctx = c.getContext('2d');
  const cw = c.width, ch = c.height;
  ctx.fillStyle = '#08080d';
  ctx.fillRect(0, 0, cw, ch);

  if (ymax === undefined) ymax = Math.max(...data) || 1;
  if (ymin === undefined) ymin = 0;
  const range = ymax - ymin || 1;
  const margin = 4;

  // Grid lines
  ctx.strokeStyle = '#1a1a2e';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= 4; i++) {
    const y = margin + (ch - 2*margin) * i / 4;
    ctx.beginPath(); ctx.moveTo(margin, y); ctx.lineTo(cw-margin, y); ctx.stroke();
  }

  // Data line
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  for (let i = 0; i < data.length; i++) {
    const x = margin + (cw - 2*margin) * i / data.length;
    const y = margin + (ch - 2*margin) * (1 - (data[i] - ymin) / range);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Analytical theory overlay for single source: I ~ 1/r^2
  if (canvasId === 'intensityPlot') {
    ctx.strokeStyle = 'rgba(255,255,100,0.3)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4,3]);
    ctx.beginPath();
    for (let i = 0; i < W; i++) {
      const dx = i - SOURCE_X;
      const r = Math.abs(dx);
      const theory = r > 3 ? 1/r : 0;
      const x = margin + (cw - 2*margin) * i / W;
      const y = margin + (ch - 2*margin) * (1 - (theory - ymin) / range);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Label
  ctx.font = '9px monospace';
  ctx.fillStyle = 'rgba(160,184,216,0.5)';
  ctx.fillText(label, margin + 2, margin + 10);
  if (canvasId === 'intensityPlot') {
    ctx.fillStyle = 'rgba(255,255,100,0.4)';
    ctx.fillText('theory 1/r', cw - 62, margin + 10);
  }
}

// ============================================================
// Mode Switching
// ============================================================
const MODE_NAMES = [
  'Full \u03c8 \u2014 amplitude as brightness, phase as color',
  'Re(\u03c8) \u2014 real part of the wavefunction',
  'Im(\u03c8) \u2014 imaginary part of the wavefunction',

];

const MODE_INFO = [
  `<strong>Full \u03c8:</strong> Each point shows the complex amplitude. <em>Color = phase</em> (angle in the complex plane). <em>Brightness = magnitude</em>. This is the <strong>complete information</strong>. The phase determines interference, diffraction, and every quantum effect. <strong>This is what the Hermitian inner product conjugates away.</strong>`,

  `<strong>Ternary mode:</strong> The FTD lattice view. Sites with |\u03c8| > K<sub>B</sub> manifest as <em>+1</em> (red) or <em>\u22121</em> (blue) based on Re(\u03c8). Everything below threshold is <strong>void</strong> (black). The ternary axiom: three states from continuous physics.`,

function setMode(m) {
  mode = m;
  document.querySelectorAll('.toolbar .btn').forEach((b, i) => {
    if (i < 7) b.classList.toggle('active', i === m);
  });
  document.getElementById('modeLabel').innerHTML = MODE_NAMES[m];
  document.getElementById('infoBox').innerHTML = MODE_INFO[m];
  const legend = document.getElementById('legend');
  legend.style.display = (m === 0 || m === 3) ? 'flex' : 'none';
  if (m === 5) probFieldDirty = true;
}

// ============================================================
// Walkthrough
// ============================================================
const WT_STEPS = [
  { title: 'Here is \u03c8', mode: 0,
    text: 'Every point carries two numbers: how big (amplitude) and how it\'s rotating (phase). This is the <em>complete information</em>. The phase determines interference, diffraction, and every quantum effect.' },
  { title: 'Re(\u03c8) and Im(\u03c8)', mode: 1,
    text: 'These are the two real-valued components of the complex amplitude. The Hermitian inner product \u27e8\u03c8|\u03c8\u27e9 multiplies one by e<sup>\u2212i\u03b8</sup> to cancel the other. Toggle to Im(\u03c8) to see the second half.' },
  { title: '\u03c8 squared', mode: 3,
    text: 'Square <em>without</em> the absolute value bars. The phase doubles (2\u03b8) but <em>survives</em>. Every color is still present. No information is destroyed. This is what you get without Born\'s ad hoc shortcut.' },
  { title: 'What the bars do', mode: 4,
    text: 'The absolute value bars strip the phase. Every color collapses to gray. You know WHERE the photon might be, but not HOW IT WAS ROTATING when it arrived. Compare with the full \u03c8 view \u2014 all that color, gone.' },
  { title: 'The bars are engineered', mode: 4,
    text: 'Born added |\u00b7|\u00b2 in a footnote (1926). Von Neumann built Hilbert space backwards from "outputs must be real." The Hermitian inner product was <em>designed</em> to guarantee real positive outputs by annihilating e<sup>i\u03b8</sup> with e<sup>\u2212i\u03b8</sup>. <strong>The bars are a design choice, not a law of nature.</strong>' },
  { title: 'The hard problem is self-inflicted', mode: 0,
    text: 'Phase IS experience. \u27e8\u03c8|\u03c8\u27e9 was designed to destroy it. The measurement operator eliminates what it\'s looking for. <strong>The hard problem exists because the Born rule was engineered to produce it.</strong>' },
];

function startWalkthrough() {
  wtActive = true; wtStep = 0;
  applyWTStep();
  document.getElementById('walkthrough').style.display = 'block';
}
function closeWalkthrough() {
  wtActive = false;
  document.getElementById('walkthrough').style.display = 'none';
}
function wtNext() { if (wtStep < WT_STEPS.length - 1) { wtStep++; applyWTStep(); } }
function wtPrev() { if (wtStep > 0) { wtStep--; applyWTStep(); } }
function applyWTStep() {
  const s = WT_STEPS[wtStep];
  document.getElementById('wtProgress').textContent = `Step ${wtStep+1} / ${WT_STEPS.length}`;
  document.getElementById('wtTitle').textContent = s.title;
  document.getElementById('wtText').innerHTML = s.text;
  setMode(s.mode);
}

// ============================================================
// Data Export
// ============================================================
function exportSnapshot() {
  const snapshot = {
    type: 'single_photon_source_snapshot',
    frame: frameCount, time: simTime,
    params: { lambda, nWavelengths, spectralWidth, kbThreshold, c: C_SPEED,
              source: { x: SOURCE_X, y: SOURCE_Y } },
    midline: { re: Array.from(midRe), im: Array.from(midIm) },
    width: W, height: H,
  };
  downloadJSON(snapshot, `photon_snapshot_${frameCount}.json`);
}

function toggleLog() {
  recording = !recording;
  document.getElementById('btnLog').textContent = recording ? 'Stop Log' : 'Start Log';
  document.getElementById('btnLog').classList.toggle('active', recording);
  if (!recording && recordedFrames.length > 0) {
    downloadJSON({
      type: 'single_photon_log',
      params: { lambda, nWavelengths, spectralWidth, c: C_SPEED },
      frames: recordedFrames,
    }, `photon_log_${Date.now()}.json`);
    recordedFrames = [];
  }
}

function exportDetector() {
  if (detectorDots.length === 0) return;
  let csv = 'x,y,alpha\n';
  detectorDots.forEach(d => { csv += `${d.x.toFixed(2)},${d.y.toFixed(2)},${d.a.toFixed(3)}\n`; });
  downloadCSV(csv, `detector_${detectorDots.length}dots.csv`);
}

function downloadJSON(obj, filename) {
  const blob = new Blob([JSON.stringify(obj)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

function downloadCSV(text, filename) {
  const blob = new Blob([text], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ============================================================
// Reset
// ============================================================
function resetSim() {
  simTime = 0; frameCount = 0;
  detectorDots = [];
  probFieldDirty = true;
}

// ============================================================
// Panel Toggle
// ============================================================
function togglePanel() {
  const body = document.getElementById('panelBody');
  body.classList.toggle('collapsed');
  document.getElementById('panelToggle').textContent = body.classList.contains('collapsed') ? '\u25b8' : '\u25be';
}

// ============================================================
// Main Render Loop
// ============================================================
function render() {
  const speed = parseFloat(document.getElementById('speedSlider').value);
  simTime += 5.0 * speed;
  frameCount++;

  // Render field
  if (useGPU) renderGPU();
  else renderCPU();

  // Overlay (source, phase wheel, dots)
  if (mode === 5) addDetectorDots();
  renderOverlay();

  // Analytics (every 4 frames)
  if (frameCount % 4 === 0) updateAnalytics();

  requestAnimationFrame(render);
}

// ============================================================
// Parameter Bindings
// ============================================================
function bindSlider(id, valId, setter) {
  const el = document.getElementById(id);
  const vel = document.getElementById(valId);
  el.addEventListener('input', () => {
    const v = parseFloat(el.value);
    vel.textContent = v;
    setter(v);
  });
}

// ============================================================
// Initialize
// ============================================================
async function init() {
  useGPU = await initGPU();
  const statusEl = document.getElementById('gpuStatus');
  if (useGPU) {
    statusEl.innerHTML = '<div class="gpu-banner">WebGPU active &mdash; GPU-accelerated Huygens-Fresnel diffraction</div>';
  } else {
    statusEl.innerHTML = '<div class="cpu-banner">WebGPU unavailable &mdash; CPU fallback (reduced resolution)</div>';
    overlayCanvas.style.pointerEvents = 'none';
  }

  setMode(0);

  bindSlider('pLambda', 'vLambda', v => { lambda = v; probFieldDirty = true; });
  bindSlider('pNWl', 'vNWl', v => { nWavelengths = Math.round(v); });
  bindSlider('pSpecW', 'vSpecW', v => { spectralWidth = v; });
  bindSlider('pKB', 'vKB', v => { kbThreshold = v; });
  bindSlider('pRate', 'vRate', v => { photonRate = Math.round(v); });

  // Keyboard for walkthrough
  document.addEventListener('keydown', e => {
    if (!wtActive) return;
    if (e.key === 'ArrowRight' || e.key === ' ') wtNext();
    if (e.key === 'ArrowLeft') wtPrev();
    if (e.key === 'Escape') closeWalkthrough();
  });

  requestAnimationFrame(render);
}

init();
