<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Prime Number Laboratory — 8 Visualizations</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #08080f; color: #ddd; font-family: 'Segoe UI', system-ui, sans-serif; }

#topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(8,8,15,0.97); padding: 6px 15px;
    border-bottom: 1px solid #333;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
#topbar h1 { font-size: 14px; color: #88bbff; white-space: nowrap; }
#topbar label { font-size: 11px; color: #999; }
#topbar input[type=range] { width: 120px; accent-color: #5599ff; }
#topbar select { background: #151520; color: #ddd; border: 1px solid #444; padding: 2px 6px; font-size: 11px; }
#topbar button { background: #151520; color: #ddd; border: 1px solid #444; padding: 2px 10px; font-size: 11px; cursor: pointer; }
#topbar button:hover { border-color: #88bbff; }
#topbar button.active { border-color: #ff9944; color: #ff9944; }
#topbar .val { font-size: 12px; color: #fff; font-weight: bold; min-width: 25px; }
#topbar .stat { font-size: 10px; color: #666; margin-left: auto; }

.tab-row { display: flex; gap: 4px; }
.tab { padding: 3px 10px; font-size: 11px; background: #151520; border: 1px solid #333;
       color: #888; cursor: pointer; border-radius: 3px 3px 0 0; }
.tab.active { color: #fff; border-color: #5599ff; border-bottom-color: #08080f; }

#viewport { margin-top: 56px; width: 100vw; height: calc(100vh - 86px); position: relative; }
canvas { display: block; width: 100%; height: 100%; }

#telemetry {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
    background: rgba(8,8,15,0.95); border-top: 1px solid #333;
    padding: 6px 15px; font-size: 11px; color: #aaa;
    display: flex; gap: 20px; flex-wrap: wrap; align-items: center;
}
#telemetry .tgroup {
    display: flex; gap: 6px; align-items: center;
    border-right: 1px solid #222; padding-right: 16px;
}
#telemetry .tgroup:last-child { border-right: none; }
#telemetry .tlabel { color: #666; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
#telemetry .tval { color: #fff; font-weight: bold; font-size: 12px; }
#telemetry .thigh { color: #ff9944; }
#telemetry .tblue { color: #5599ff; }
#telemetry .tred { color: #ff4444; }
#telemetry .tgreen { color: #66dd88; }
#telemetry .tdim { color: #555; font-size: 10px; }
</style>
</head>
<body>

<div id="topbar">
    <h1>Prime Laboratory</h1>
    <div class="tab-row">
        <div class="tab active" data-tab="gaussian">Gaussian</div>
        <div class="tab" data-tab="eisenstein">Eisenstein</div>
        <div class="tab" data-tab="sacks">Sacks Spiral</div>
        <div class="tab" data-tab="divisor">Divisor Topo</div>
        <div class="tab" data-tab="goldbach">Goldbach</div>
        <div class="tab" data-tab="automata">Automata</div>
        <div class="tab" data-tab="moats">Moat Map</div>
        <div class="tab" data-tab="race">Prime Race</div>
    </div>
    <label>Bound:</label>
    <input type="range" id="boundSlider" min="10" max="800" value="50" step="5">
    <span class="val" id="boundVal">50</span>
    <label>Speed:</label>
    <input type="range" id="speedSlider" min="0" max="2000" value="0" step="50">
    <span class="val" id="speedVal">Off</span>
    <button id="playBtn">▶</button>
    <button id="resetBtn">⟲</button>
    <button id="genBtn" style="display:none;">Next Gen</button>
    <span class="stat" id="stats"></span>
</div>

<div id="viewport">
    <canvas id="canvas"></canvas>
</div>
<div id="telemetry"></div>

<script>
// =====================================================
// MATH UTILITIES
// =====================================================

function sievePrimes(max) {
    if (max < 2) return new Uint8Array(max + 1);
    const s = new Uint8Array(max + 1);
    s[0] = s[1] = 1;
    for (let i = 2; i * i <= max; i++)
        if (!s[i]) for (let j = i * i; j <= max; j += i) s[j] = 1;
    return s;
}

function isPrimeSiv(n, siv) { return n >= 2 && n < siv.length && !siv[n]; }

function setTelemetry(groups) {
    // groups: array of { label, value, cls? } or { html }
    const el = document.getElementById('telemetry');
    el.innerHTML = groups.map(g => {
        if (g.html) return `<div class="tgroup">${g.html}</div>`;
        const cls = g.cls || '';
        return `<div class="tgroup"><span class="tlabel">${g.label}</span> <span class="tval ${cls}">${g.value}</span></div>`;
    }).join('');
}

function divisorCount(n) {
    if (n <= 1) return n;
    let count = 0;
    for (let d = 1; d * d <= n; d++) {
        if (n % d === 0) { count += 2; if (d * d === n) count--; }
    }
    return count;
}

function goldbachCount(n) {
    if (n < 4 || n % 2 !== 0) return 0;
    const siv = sievePrimes(n);
    let count = 0;
    for (let p = 2; p <= n / 2; p++) {
        if (!siv[p] && !siv[n - p]) count++;
    }
    return count;
}

// =====================================================
// CANVAS SETUP
// =====================================================

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let currentTab = 'gaussian';
let W, H;

function resize() {
    const vp = document.getElementById('viewport');
    W = canvas.width = vp.clientWidth;
    H = canvas.height = vp.clientHeight;
}
window.addEventListener('resize', () => { resize(); draw(); });

// =====================================================
// TAB: GAUSSIAN PRIMES
// =====================================================

function drawGaussian() {
    const bound = parseInt(document.getElementById('boundSlider').value);
    const maxNorm = 2 * bound * bound;
    const siv = sievePrimes(maxNorm);

    ctx.fillStyle = '#08080f';
    ctx.fillRect(0, 0, W, H);

    const scale = Math.min(W, H) / (2 * bound + 2);
    const cx = W / 2, cy = H / 2;

    let count = 0;
    for (let a = -bound; a <= bound; a++) {
        for (let b = -bound; b <= bound; b++) {
            let isPrime = false, isInert = false;
            if (a === 0 && b === 0) continue;
            if (a === 0 || b === 0) {
                const v = Math.abs(a || b);
                if (v < siv.length && !siv[v] && v % 4 === 3) { isPrime = true; isInert = true; }
            } else {
                const n = a*a + b*b;
                if (n < siv.length && !siv[n]) isPrime = true;
            }
            if (isPrime) {
                ctx.fillStyle = isInert ? '#ff4433' : 'rgba(68,170,255,0.8)';
                const sz = isInert ? 2.5 : Math.max(0.8, Math.min(2, 60/bound));
                ctx.fillRect(cx + a*scale - sz, cy - b*scale - sz, sz*2, sz*2);
                count++;
            }
        }
    }
    // Telemetry
    let splitCount = 0, inertCount = 0;
    for (let a = -bound; a <= bound; a++) {
        for (let b = -bound; b <= bound; b++) {
            if (a === 0 && b === 0) continue;
            if (a === 0 || b === 0) {
                const v = Math.abs(a || b);
                if (v < siv.length && !siv[v] && v % 4 === 3) inertCount++;
            } else {
                const n = a*a + b*b;
                if (n < siv.length && !siv[n]) splitCount++;
            }
        }
    }
    const total = (2*bound+1)*(2*bound+1) - 1;
    const density = ((splitCount + inertCount) / total * 100).toFixed(2);
    const ratio = inertCount > 0 ? (splitCount / inertCount).toFixed(1) : '∞';
    setTelemetry([
        { label: 'Split (1 mod 4)', value: splitCount.toLocaleString(), cls: 'tblue' },
        { label: 'Inert (3 mod 4)', value: inertCount.toLocaleString(), cls: 'tred' },
        { label: 'Total', value: (splitCount+inertCount).toLocaleString(), cls: 'thigh' },
        { label: 'Density', value: density + '%' },
        { label: 'Split/Inert', value: ratio + '×' },
        { label: 'Lattice pts', value: total.toLocaleString(), cls: 'tdim' },
        { label: 'Max norm', value: maxNorm.toLocaleString(), cls: 'tdim' },
    ]);
    return (splitCount+inertCount) + ' Gaussian primes';
}

// =====================================================
// TAB: EISENSTEIN PRIMES
// =====================================================

function drawEisenstein() {
    const bound = parseInt(document.getElementById('boundSlider').value);
    // omega = e^{2pi i/3} = -1/2 + sqrt(3)/2 i
    // Eisenstein integer: z = a + b*omega, norm = a^2 - a*b + b^2
    // Eisenstein prime if norm is ordinary prime, or if on axis and p ≡ 2 (mod 3)
    const maxNorm = 3 * bound * bound;
    const siv = sievePrimes(maxNorm);

    ctx.fillStyle = '#08080f';
    ctx.fillRect(0, 0, W, H);

    const sqrt3_2 = Math.sqrt(3) / 2;
    const scale = Math.min(W, H) / (2.5 * bound);
    const cx = W / 2, cy = H / 2;

    let count = 0;
    for (let a = -bound; a <= bound; a++) {
        for (let b = -bound; b <= bound; b++) {
            const norm = a*a - a*b + b*b;
            if (norm === 0) continue;

            let isPrime = false;
            let isAxis = false;

            // Axis units: a + b*omega where b=0 or a=0 or a=b
            if (b === 0 || a === 0 || a === b) {
                const v = Math.abs(norm);
                // Eisenstein prime on axis if |unit component| is ordinary prime ≡ 2 (mod 3)
                if (norm > 0 && norm < siv.length && !siv[norm] && norm % 3 === 2) {
                    isPrime = true; isAxis = true;
                }
            }
            // Off-axis: norm is an ordinary prime
            if (!isPrime && norm > 0 && norm < siv.length && !siv[norm]) {
                isPrime = true;
            }

            if (isPrime) {
                // Convert (a, b) to Cartesian: x = a + b*(-1/2), y = b*(sqrt3/2)
                const px = a + b * (-0.5);
                const py = b * sqrt3_2;
                ctx.fillStyle = isAxis ? '#ff6644' : 'rgba(100,220,160,0.8)';
                const sz = isAxis ? 2.5 : Math.max(0.8, Math.min(2, 60/bound));
                ctx.fillRect(cx + px*scale - sz, cy - py*scale - sz, sz*2, sz*2);
                count++;
            }
        }
    }

    // Draw hex grid lines lightly
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 0.5;
    // Horizontal-ish lines
    for (let b = -bound; b <= bound; b += Math.max(1, Math.floor(bound/15))) {
        ctx.beginPath();
        const y = b * sqrt3_2;
        ctx.moveTo(cx + (-bound - b*0.5)*scale, cy - y*scale);
        ctx.lineTo(cx + (bound - b*0.5)*scale, cy - y*scale);
        ctx.stroke();
    }

    let axisCount = 0, offAxis = 0;
    // Recount for telemetry
    for (let a = -bound; a <= bound; a++) {
        for (let b = -bound; b <= bound; b++) {
            const norm = a*a - a*b + b*b;
            if (norm === 0) continue;
            let ip = false, ia = false;
            if (b === 0 || a === 0 || a === b) {
                if (norm > 0 && norm < siv.length && !siv[norm] && norm % 3 === 2) { ip = true; ia = true; }
            }
            if (!ip && norm > 0 && norm < siv.length && !siv[norm]) ip = true;
            if (ip) { if (ia) axisCount++; else offAxis++; }
        }
    }
    const total = offAxis + axisCount;
    const latticeTotal = (2*bound+1)*(2*bound+1) - 1;
    setTelemetry([
        { label: 'Off-axis (split)', value: offAxis.toLocaleString(), cls: 'tgreen' },
        { label: 'On-axis (inert)', value: axisCount.toLocaleString(), cls: 'tred' },
        { label: 'Total Eisenstein', value: total.toLocaleString(), cls: 'thigh' },
        { label: 'Density', value: (total / latticeTotal * 100).toFixed(2) + '%' },
        { label: 'Symmetry', value: 'D₆ (6-fold)', cls: 'tgreen' },
        { label: 'Ring', value: 'Z[ω], ω = e^{2πi/3}', cls: 'tdim' },
    ]);
    return total + ' Eisenstein primes';
}

// =====================================================
// TAB: SACKS SPIRAL
// =====================================================

function drawSacks() {
    const bound = parseInt(document.getElementById('boundSlider').value);
    const maxN = bound * bound;
    const siv = sievePrimes(maxN);

    ctx.fillStyle = '#08080f';
    ctx.fillRect(0, 0, W, H);

    const cx = W / 2, cy = H / 2;
    const maxR = Math.min(W, H) * 0.45;

    let count = 0;
    for (let n = 1; n <= maxN; n++) {
        // Sacks spiral: angle = 2*pi*sqrt(n), radius = sqrt(n)
        const sqrtN = Math.sqrt(n);
        const angle = 2 * Math.PI * sqrtN;
        const r = (sqrtN / Math.sqrt(maxN)) * maxR;
        const px = cx + r * Math.cos(angle);
        const py = cy - r * Math.sin(angle);

        if (!siv[n]) {
            // Prime
            const t = sqrtN / Math.sqrt(maxN);
            const red = Math.floor(50 + 200 * t);
            const green = Math.floor(100 + 150 * (1-t));
            const blue = Math.floor(255 * (1-t*0.3));
            ctx.fillStyle = `rgb(${red},${green},${blue})`;
            ctx.fillRect(px - 1, py - 1, 2, 2);
            count++;
        }
    }

    // Draw perfect square line
    ctx.strokeStyle = 'rgba(255,200,50,0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let n = 1; n * n <= maxN; n++) {
        const sqrtN = n;
        const r = (sqrtN / Math.sqrt(maxN)) * maxR;
        const angle = 2 * Math.PI * sqrtN;
        const px = cx + r * Math.cos(angle);
        const py = cy - r * Math.sin(angle);
        if (n === 1) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();

    // Count by mod 4
    let mod1 = 0, mod3 = 0;
    for (let n = 3; n <= maxN; n += 2) {
        if (!siv[n]) { if (n % 4 === 1) mod1++; else mod3++; }
    }
    const pNt = count > 0 ? (maxN / Math.log(maxN)).toFixed(0) : 0;
    setTelemetry([
        { label: 'Primes found', value: count.toLocaleString(), cls: 'thigh' },
        { label: 'π(n) estimate', value: Number(pNt).toLocaleString(), cls: 'tdim' },
        { label: 'Ratio actual/PNT', value: (count / pNt).toFixed(3) },
        { label: '1 mod 4', value: mod1.toLocaleString(), cls: 'tblue' },
        { label: '3 mod 4', value: mod3.toLocaleString(), cls: 'tred' },
        { label: 'n range', value: '1 – ' + maxN.toLocaleString(), cls: 'tdim' },
        { label: 'Spiral arms', value: 'Parabolic curves', cls: 'tgreen' },
    ]);
    return count + ' primes on Sacks spiral';
}

// =====================================================
// TAB: DIVISOR COUNT TOPOLOGY
// =====================================================

function drawDivisor() {
    const bound = parseInt(document.getElementById('boundSlider').value);
    const maxN = bound * 4;

    ctx.fillStyle = '#08080f';
    ctx.fillRect(0, 0, W, H);

    const size = Math.min(W, H);
    const gridSize = 2 * bound + 1;
    const cellW = W / gridSize;
    const cellH = H / gridSize;

    let maxDiv = 1;
    // Pre-scan for max
    for (let x = -bound; x <= bound; x++) {
        for (let y = -bound; y <= bound; y++) {
            const n = x*x + y*y;
            if (n > 0) {
                const d = divisorCount(n);
                if (d > maxDiv) maxDiv = d;
            }
        }
    }

    const imgData = ctx.createImageData(W, H);
    const px = imgData.data;

    for (let py = 0; py < H; py++) {
        for (let pxI = 0; pxI < W; pxI++) {
            const gx = Math.round((pxI / W) * gridSize - bound);
            const gy = Math.round(bound - (py / H) * gridSize);
            const n = gx*gx + gy*gy;
            const i = (py * W + pxI) * 4;

            if (n === 0) {
                px[i] = px[i+1] = px[i+2] = 20; px[i+3] = 255;
                continue;
            }

            const d = divisorCount(n);
            const t = Math.log(d) / Math.log(maxDiv);

            // Dark for primes (d=1 or 2), bright for highly composite
            if (d <= 2) {
                px[i] = 5; px[i+1] = 5; px[i+2] = 20; px[i+3] = 255;
            } else {
                px[i] = Math.floor(255 * t * t);
                px[i+1] = Math.floor(180 * t * (1-t*0.3));
                px[i+2] = Math.floor(50 * (1-t));
                px[i+3] = 255;
            }
        }
    }
    ctx.putImageData(imgData, 0, 0);

    // Find some stats
    let primeNorms = 0, hcCount = 0, avgDiv = 0, samples = 0;
    let maxDivNorm = 0;
    for (let x = -bound; x <= bound; x++) {
        for (let y = -bound; y <= bound; y++) {
            const n = x*x + y*y;
            if (n <= 0) continue;
            const d = divisorCount(n);
            avgDiv += d; samples++;
            if (d <= 2) primeNorms++;
            if (d >= maxDiv * 0.8) hcCount++;
            if (d === maxDiv) maxDivNorm = n;
        }
    }
    avgDiv = samples > 0 ? (avgDiv / samples).toFixed(1) : 0;
    setTelemetry([
        { label: 'Max divisors', value: maxDiv, cls: 'thigh' },
        { label: 'At norm', value: maxDivNorm.toLocaleString(), cls: 'tdim' },
        { label: 'Avg divisors', value: avgDiv },
        { label: 'Prime norms (d≤2)', value: primeNorms.toLocaleString(), cls: 'tblue' },
        { label: 'HC norms (≥80% max)', value: hcCount.toLocaleString(), cls: 'tred' },
        { label: 'Metric', value: 'd(a²+b²)', cls: 'tdim' },
    ]);
    return 'Divisor topology (max d = ' + maxDiv + ')';
}

// =====================================================
// TAB: GOLDBACH INTERSECTIONS
// =====================================================

function drawGoldbach() {
    const bound = Math.min(parseInt(document.getElementById('boundSlider').value), 200);
    const maxN = bound * 4;
    const siv = sievePrimes(maxN);

    ctx.fillStyle = '#08080f';
    ctx.fillRect(0, 0, W, H);

    // Cache Goldbach counts
    const gbCache = new Map();
    function gb(n) {
        if (gbCache.has(n)) return gbCache.get(n);
        if (n < 4 || n % 2 !== 0) { gbCache.set(n, 0); return 0; }
        let c = 0;
        for (let p = 2; p <= n/2; p++) {
            if (p < siv.length && !siv[p] && (n-p) < siv.length && !siv[n-p]) c++;
        }
        gbCache.set(n, c);
        return c;
    }

    const gridSize = 2 * bound + 1;
    let maxGB = 1;

    // Pre-scan
    for (let x = -bound; x <= bound; x += 2) {
        for (let y = -bound; y <= bound; y += 2) {
            const N = (Math.abs(x) + Math.abs(y));
            const even = N % 2 === 0 ? N : N + 1;
            if (even >= 4) {
                const g = gb(even);
                if (g > maxGB) maxGB = g;
            }
        }
    }

    const imgData = ctx.createImageData(W, H);
    const px = imgData.data;

    for (let py = 0; py < H; py++) {
        for (let pxI = 0; pxI < W; pxI++) {
            const gx = Math.round((pxI / W) * gridSize - bound);
            const gy = Math.round(bound - (py / H) * gridSize);
            const N = Math.abs(gx) + Math.abs(gy);
            const even = N % 2 === 0 ? N : N + 1;
            const i = (py * W + pxI) * 4;

            if (even < 4) {
                px[i] = px[i+1] = px[i+2] = 5; px[i+3] = 255;
                continue;
            }

            const g = gb(even);
            const t = g / maxGB;

            px[i] = Math.floor(20 + 200 * t * t);
            px[i+1] = Math.floor(10 + 100 * t);
            px[i+2] = Math.floor(80 * (1 - t) + 180 * t * t * t);
            px[i+3] = 255;
        }
    }
    ctx.putImageData(imgData, 0, 0);

    // Extra stats
    let totalPairs = 0, evenCount = 0;
    for (let n = 4; n <= bound * 4; n += 2) {
        const g = gb(n);
        totalPairs += g;
        evenCount++;
    }
    const avgPairs = evenCount > 0 ? (totalPairs / evenCount).toFixed(1) : 0;
    // Find the even number with most pairs
    let bestN = 4, bestG = 0;
    for (const [n, g] of gbCache) {
        if (g > bestG) { bestG = g; bestN = n; }
    }
    setTelemetry([
        { label: 'Max pairs', value: maxGB, cls: 'thigh' },
        { label: 'At N =', value: bestN.toLocaleString(), cls: 'tdim' },
        { label: 'Avg pairs', value: avgPairs },
        { label: 'Even numbers tested', value: evenCount.toLocaleString() },
        { label: 'Conjecture status', value: 'UNPROVEN', cls: 'tred' },
        { label: 'Bound (capped)', value: bound, cls: 'tdim' },
    ]);
    return 'Goldbach comet 2D';
}

// =====================================================
// TAB: CELLULAR AUTOMATA (Game of Life on primes)
// =====================================================

let automataGrid = null;
let automataSize = 0;
let automataGen = 0;

function initAutomata() {
    const bound = parseInt(document.getElementById('boundSlider').value);
    automataSize = 2 * bound + 1;
    const maxNorm = 2 * bound * bound;
    const siv = sievePrimes(maxNorm);

    automataGrid = new Uint8Array(automataSize * automataSize);
    for (let a = -bound; a <= bound; a++) {
        for (let b = -bound; b <= bound; b++) {
            const i = (b + bound) * automataSize + (a + bound);
            if (a === 0 && b === 0) continue;
            if (a === 0 || b === 0) {
                const v = Math.abs(a || b);
                if (v < siv.length && !siv[v] && v % 4 === 3) automataGrid[i] = 1;
            } else {
                const n = a*a + b*b;
                if (n < siv.length && !siv[n]) automataGrid[i] = 1;
            }
        }
    }
    automataGen = 0;
}

function stepAutomata() {
    const S = automataSize;
    const next = new Uint8Array(S * S);
    for (let y = 1; y < S - 1; y++) {
        for (let x = 1; x < S - 1; x++) {
            let neighbors = 0;
            for (let dy = -1; dy <= 1; dy++)
                for (let dx = -1; dx <= 1; dx++)
                    if (dx !== 0 || dy !== 0)
                        neighbors += automataGrid[(y+dy)*S + (x+dx)];

            const alive = automataGrid[y * S + x];
            // Conway's Game of Life rules
            if (alive) next[y * S + x] = (neighbors === 2 || neighbors === 3) ? 1 : 0;
            else next[y * S + x] = (neighbors === 3) ? 1 : 0;
        }
    }
    automataGrid = next;
    automataGen++;
}

function drawAutomata() {
    if (!automataGrid || automataSize !== 2 * parseInt(document.getElementById('boundSlider').value) + 1) {
        initAutomata();
    }

    ctx.fillStyle = '#08080f';
    ctx.fillRect(0, 0, W, H);

    const S = automataSize;
    const cellW = W / S;
    const cellH = H / S;

    let alive = 0;
    for (let y = 0; y < S; y++) {
        for (let x = 0; x < S; x++) {
            if (automataGrid[y * S + x]) {
                alive++;
                const t = automataGen / 50;
                // Color shifts over generations
                const r = Math.floor(68 + 180 * Math.sin(t + x*0.01));
                const g = Math.floor(170 - 100 * Math.sin(t + y*0.01));
                const b = Math.floor(255 - 50 * t);
                ctx.fillStyle = `rgb(${Math.max(0,Math.min(255,r))},${Math.max(0,Math.min(255,g))},${Math.max(0,Math.min(255,b))})`;
                ctx.fillRect(x * cellW, y * cellH, Math.max(1, cellW), Math.max(1, cellH));
            }
        }
    }

    const totalCells = S * S;
    const alivePct = (alive / totalCells * 100).toFixed(2);
    // Count initial primes for comparison
    let initPrimes = 0;
    if (automataGen === 0) {
        initPrimes = alive;
        drawAutomata._initPrimes = alive;
    } else {
        initPrimes = drawAutomata._initPrimes || alive;
    }
    const survivalRate = initPrimes > 0 ? (alive / initPrimes * 100).toFixed(1) : '—';
    setTelemetry([
        { label: 'Generation', value: automataGen, cls: 'thigh' },
        { label: 'Alive', value: alive.toLocaleString(), cls: 'tgreen' },
        { label: 'Dead', value: (totalCells - alive).toLocaleString(), cls: 'tdim' },
        { label: 'Alive %', value: alivePct + '%' },
        { label: 'vs Gen 0', value: survivalRate + '%', cls: automataGen === 0 ? 'tdim' : (alive > initPrimes ? 'tgreen' : 'tred') },
        { label: 'Grid', value: S + '×' + S, cls: 'tdim' },
        { label: 'Rules', value: 'B3/S23 (Conway)', cls: 'tdim' },
    ]);
    return 'Game of Life Gen ' + automataGen;
}
drawAutomata._initPrimes = 0;

// =====================================================
// TAB: MOAT MAP (distance to nearest prime)
// =====================================================

function drawMoats() {
    const bound = parseInt(document.getElementById('boundSlider').value);
    const maxNorm = 2 * bound * bound;
    const siv = sievePrimes(maxNorm);
    const size = 2 * bound + 1;

    const primeGrid = new Uint8Array(size * size);
    for (let a = -bound; a <= bound; a++) {
        for (let b = -bound; b <= bound; b++) {
            const i = (b + bound) * size + (a + bound);
            if (a === 0 && b === 0) continue;
            if (a === 0 || b === 0) {
                const v = Math.abs(a || b);
                if (v < siv.length && !siv[v] && v % 4 === 3) primeGrid[i] = 1;
            } else {
                const n = a*a + b*b;
                if (n < siv.length && !siv[n]) primeGrid[i] = 1;
            }
        }
    }

    // BFS distance
    const dist = new Float32Array(size * size);
    dist.fill(999);
    const queue = [];
    for (let i = 0; i < primeGrid.length; i++) {
        if (primeGrid[i]) { dist[i] = 0; queue.push(i); }
    }
    const offsets = [-size-1, -size, -size+1, -1, 1, size-1, size, size+1];
    const dists = [1.414, 1, 1.414, 1, 1, 1.414, 1, 1.414];
    let head = 0;
    while (head < queue.length) {
        const ci = queue[head++];
        for (let k = 0; k < 8; k++) {
            const ni = ci + offsets[k];
            if (ni >= 0 && ni < dist.length) {
                const nd = dist[ci] + dists[k];
                if (nd < dist[ni]) { dist[ni] = nd; queue.push(ni); }
            }
        }
    }

    const imgData = ctx.createImageData(W, H);
    const px = imgData.data;
    for (let py = 0; py < H; py++) {
        for (let pxI = 0; pxI < W; pxI++) {
            const ga = Math.round((pxI / W) * size);
            const gb = Math.round((py / H) * size);
            const idx = (py * W + pxI) * 4;
            if (ga < 0 || ga >= size || gb < 0 || gb >= size) {
                px[idx] = px[idx+1] = px[idx+2] = 5; px[idx+3] = 255; continue;
            }
            const gi = gb * size + ga;
            const d = Math.min(dist[gi] / 6, 1);
            if (primeGrid[gi]) {
                px[idx] = 40; px[idx+1] = 120; px[idx+2] = 255; px[idx+3] = 255;
            } else {
                px[idx] = Math.floor(255 * d * d);
                px[idx+1] = Math.floor(180 * d * (1 - d * 0.5));
                px[idx+2] = Math.floor(30 * (1 - d));
                px[idx+3] = 255;
            }
        }
    }
    ctx.putImageData(imgData, 0, 0);

    // Moat stats
    let maxDist = 0, totalDist = 0, moatCount = 0, primeCount = 0;
    for (let i = 0; i < dist.length; i++) {
        if (primeGrid[i]) { primeCount++; continue; }
        if (dist[i] < 900) {
            if (dist[i] > maxDist) maxDist = dist[i];
            totalDist += dist[i];
            moatCount++;
        }
    }
    const avgDist = moatCount > 0 ? (totalDist / moatCount).toFixed(2) : 0;
    // Count how many points are in "deep" moats (dist > 3)
    let deepCount = 0;
    for (let i = 0; i < dist.length; i++) {
        if (!primeGrid[i] && dist[i] > 3 && dist[i] < 900) deepCount++;
    }
    setTelemetry([
        { label: 'Max moat depth', value: maxDist.toFixed(1), cls: 'thigh' },
        { label: 'Avg distance', value: avgDist },
        { label: 'Primes', value: primeCount.toLocaleString(), cls: 'tblue' },
        { label: 'Composites', value: moatCount.toLocaleString() },
        { label: 'Deep moat (d>3)', value: deepCount.toLocaleString(), cls: 'tred' },
        { label: 'Deep %', value: (moatCount > 0 ? (deepCount/moatCount*100).toFixed(1) : 0) + '%', cls: 'tdim' },
        { label: 'Moat problem', value: 'OPEN', cls: 'tred' },
    ]);
    return 'Moat map';
}

// =====================================================
// TAB: PRIME RACE
// =====================================================

function drawRace() {
    const limit = parseInt(document.getElementById('boundSlider').value) * 100;
    const siv = sievePrimes(limit);

    ctx.fillStyle = '#08080f';
    ctx.fillRect(0, 0, W, H);

    let c1 = 0, c3 = 0;
    const xs = [], y1 = [], y3 = [];
    for (let p = 3; p <= limit; p += 2) {
        if (siv[p]) continue;
        if (p % 4 === 1) c1++; else c3++;
        xs.push(p); y1.push(c1); y3.push(c3);
    }

    const maxX = limit, maxY = Math.max(c1, c3);
    const margin = 50;
    const plotW = W - 2 * margin, plotH = H - 2 * margin;

    // Axes
    ctx.strokeStyle = '#333'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(margin, margin); ctx.lineTo(margin, H - margin); ctx.lineTo(W - margin, H - margin); ctx.stroke();

    // Lines
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#4499ff';
    ctx.beginPath();
    for (let i = 0; i < xs.length; i++) {
        const px = margin + (xs[i] / maxX) * plotW;
        const py = H - margin - (y1[i] / maxY) * plotH;
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.stroke();

    ctx.strokeStyle = '#ff9944';
    ctx.beginPath();
    for (let i = 0; i < xs.length; i++) {
        const px = margin + (xs[i] / maxX) * plotW;
        const py = H - margin - (y3[i] / maxY) * plotH;
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.stroke();

    // Labels
    ctx.fillStyle = '#4499ff'; ctx.font = '12px sans-serif';
    ctx.fillText('p ≡ 1 (mod 4) — split in Z[i]', margin + 10, margin + 15);
    ctx.fillStyle = '#ff9944';
    ctx.fillText('p ≡ 3 (mod 4) — inert in Z[i]', margin + 10, margin + 30);

    // Compute lead changes
    let leadChanges = 0;
    for (let i = 1; i < y1.length; i++) {
        if ((y1[i] > y3[i]) !== (y1[i-1] > y3[i-1])) leadChanges++;
    }
    // Compute % of time inert leads
    let inertLeadCount = 0;
    for (let i = 0; i < y1.length; i++) {
        if (y3[i] > y1[i]) inertLeadCount++;
    }
    const inertLeadPct = y1.length > 0 ? (inertLeadCount / y1.length * 100).toFixed(1) : 0;
    const pnt = (limit / Math.log(limit)).toFixed(0);

    setTelemetry([
        { label: 'Split (1 mod 4)', value: c1.toLocaleString(), cls: 'tblue' },
        { label: 'Inert (3 mod 4)', value: c3.toLocaleString(), cls: 'tred' },
        { label: 'Current lead', value: c3 > c1 ? 'INERT' : 'SPLIT', cls: c3 > c1 ? 'tred' : 'tblue' },
        { label: 'Gap', value: Math.abs(c1 - c3).toLocaleString() },
        { label: 'Lead changes', value: leadChanges.toLocaleString(), cls: 'thigh' },
        { label: 'Inert leads', value: inertLeadPct + '% of time', cls: 'tdim' },
        { label: 'π(n)/PNT', value: ((c1+c3+1) / Number(pnt)).toFixed(3), cls: 'tdim' },
        { label: 'Chebyshev bias', value: inertLeadPct > 50 ? 'CONFIRMED' : 'not yet', cls: inertLeadPct > 50 ? 'tgreen' : 'tdim' },
    ]);
    return `Prime race to ${limit}`;
}

// =====================================================
// DISPATCH
// =====================================================

function draw() {
    resize();
    let stat;
    const t0 = performance.now();

    switch (currentTab) {
        case 'gaussian': stat = drawGaussian(); break;
        case 'eisenstein': stat = drawEisenstein(); break;
        case 'sacks': stat = drawSacks(); break;
        case 'divisor': stat = drawDivisor(); break;
        case 'goldbach': stat = drawGoldbach(); break;
        case 'automata': stat = drawAutomata(); break;
        case 'moats': stat = drawMoats(); break;
        case 'race': stat = drawRace(); break;
    }

    const dt = (performance.now() - t0).toFixed(0);
    document.getElementById('stats').textContent = stat + ' | ' + dt + 'ms';

    document.getElementById('genBtn').style.display = currentTab === 'automata' ? 'inline-block' : 'none';
}

// =====================================================
// CONTROLS
// =====================================================

// Tabs
document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentTab = tab.dataset.tab;
        if (currentTab === 'automata') initAutomata();
        draw();
    });
});

// Bound slider
let updateTimer = null;
document.getElementById('boundSlider').addEventListener('input', () => {
    document.getElementById('boundVal').textContent = document.getElementById('boundSlider').value;
    clearTimeout(updateTimer);
    updateTimer = setTimeout(() => {
        if (currentTab === 'automata') initAutomata();
        draw();
    }, 150);
});

// Automata next gen
document.getElementById('genBtn').addEventListener('click', () => {
    stepAutomata();
    draw();
});

// Animation
let animInterval = null, playing = false;
function updateSpeedLabel() {
    const v = parseInt(document.getElementById('speedSlider').value);
    document.getElementById('speedVal').textContent = v === 0 ? 'Off' : v + 'ms';
}

function stopAnim() {
    playing = false;
    if (animInterval) { clearInterval(animInterval); animInterval = null; }
    document.getElementById('playBtn').textContent = '▶';
}

function startAnim() {
    const speed = parseInt(document.getElementById('speedSlider').value);
    if (speed === 0) return;
    playing = true;
    document.getElementById('playBtn').textContent = '⏸';
    animInterval = setInterval(() => {
        if (currentTab === 'automata') {
            stepAutomata();
            draw();
        } else {
            const slider = document.getElementById('boundSlider');
            let v = parseInt(slider.value) + 10;
            if (v > parseInt(slider.max)) { stopAnim(); return; }
            slider.value = v;
            document.getElementById('boundVal').textContent = v;
            draw();
        }
    }, speed);
}

document.getElementById('playBtn').addEventListener('click', () => {
    if (playing) stopAnim();
    else {
        if (parseInt(document.getElementById('speedSlider').value) === 0) {
            document.getElementById('speedSlider').value = 300;
            updateSpeedLabel();
        }
        startAnim();
    }
});

document.getElementById('speedSlider').addEventListener('input', () => {
    updateSpeedLabel();
    if (playing) { stopAnim(); startAnim(); }
});

document.getElementById('resetBtn').addEventListener('click', () => {
    stopAnim();
    document.getElementById('boundSlider').value = 10;
    document.getElementById('boundVal').textContent = '10';
    if (currentTab === 'automata') initAutomata();
    draw();
});

updateSpeedLabel();
draw();
</script>
</body>
