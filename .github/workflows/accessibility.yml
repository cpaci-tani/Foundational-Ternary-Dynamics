# FTD Accessibility Validation Pipeline
# Checks for WCAG 2.1 Level AA compliance

name: Accessibility

on:
  push:
    branches: [main]
    paths:
      - 'dissemination/manuscript/**'
  pull_request:
    branches: [main]
    paths:
      - 'dissemination/manuscript/**'

jobs:
  accessibility-audit:
    runs-on: ubuntu-latest
    # Quarto rendering may fail if freeze artifacts are missing
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install accessibility tools
        run: |
          npm install -g pa11y pa11y-ci

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build manuscript
        run: |
          cd dissemination/manuscript/src
          quarto render --profile html
        timeout-minutes: 30

      - name: Run Pa11y accessibility audit
        run: |
          # Create pa11y config
          cat > .pa11yci << 'EOF'
          {
            "defaults": {
              "standard": "WCAG2AA",
              "timeout": 30000,
              "wait": 1000
            },
            "urls": []
          }
          EOF

          # Find HTML files and run pa11y on each
          find dissemination/manuscript/_webbook -name "*.html" -type f | head -20 | while read file; do
            echo "Checking: $file"
            pa11y "$file" --standard WCAG2AA --reporter cli || true
          done
        continue-on-error: true

  figure-alt-text:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check figures have alt text
        run: |
          echo "Checking for missing alt text in manuscript figures..."

          # Find image references without fig-alt
          missing_alt=$(grep -r "!\[" dissemination/manuscript/src/chapters/*.qmd | grep -v "fig-alt" | grep -v "^#" || true)

          if [ -n "$missing_alt" ]; then
            echo "WARNING: The following images may be missing alt text:"
            echo "$missing_alt"
            echo ""
            echo "Consider adding fig-alt attributes for accessibility."
          else
            echo "All image references appear to have alt text or descriptions."
          fi

  color-contrast:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Verify colorblind-safe palette
        run: |
          echo "Checking color definitions for accessibility..."
          python3 .github/scripts/check_color_contrast.py
