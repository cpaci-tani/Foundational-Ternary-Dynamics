# Sift WinUI 3 validation

name: Sift

on:
  push:
    paths:
      - 'apps/Sift/**'
      - 'apps/Sift.Core/**'
      - 'apps/Sift.Tests/**'
      - 'apps/Sift.UnitTests/**'
      - '.github/workflows/sift.yml'
  pull_request:
    paths:
      - 'apps/Sift/**'
      - 'apps/Sift.Core/**'
      - 'apps/Sift.Tests/**'
      - 'apps/Sift.UnitTests/**'
      - '.github/workflows/sift.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate Core and WinUI source
        shell: pwsh
        run: apps/Sift/scripts/validate.ps1 -SkipUi

      - name: Verify self-contained publish
        shell: pwsh
        run: apps/Sift/build-release.ps1 -OutputDirectory "${{ runner.temp }}\Sift"

  reproducible-webassets:
    # Rebuild the committed Monaco/xterm bundle from source on a clean checkout and prove it is
    # byte-identical to what is checked in, so the shipped Script Studio assets are reproducible and
    # not an opaque committed blob. verify-script-studio.ps1 only checks the committed set against its
    # own manifest; this job is the independent source-of-truth rebuild.
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/Sift
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install locked dependencies
        run: npm ci

      - name: Rebuild Script Studio assets from source
        run: npm run build

      - name: Assert committed bundle matches a fresh build
        shell: pwsh
        run: |
          git diff --exit-code -- WebAssets/dist
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'WebAssets/dist is not reproducible from source. Run npm ci && npm run build from apps/Sift and commit the result.'
            exit 1
          }
