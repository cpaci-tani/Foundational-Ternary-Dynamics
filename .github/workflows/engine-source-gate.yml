name: Engine CPU Source Gate

on:
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/engine-source-gate.yml'
      - 'scripts/ci/**'
      - 'engine/CMakeLists.txt'
      - 'engine/cmake/**'
      - 'engine/include/**'
      - 'engine/src/**'
      - 'engine/cuda/**'
      - 'engine/tests/*.cpp'
      - 'engine/tests/*.h'
      - 'engine/tests/**/*.cpp'
      - 'engine/tests/**/*.h'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/engine-source-gate.yml'
      - 'scripts/ci/**'
      - 'engine/CMakeLists.txt'
      - 'engine/cmake/**'
      - 'engine/include/**'
      - 'engine/src/**'
      - 'engine/cuda/**'
      - 'engine/tests/*.cpp'
      - 'engine/tests/*.h'
      - 'engine/tests/**/*.cpp'
      - 'engine/tests/**/*.h'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: engine-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Route changes and reuse successful identical PR checks
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/ci_changes.py --workflow engine-source-gate.yml --scope engine

  merge-gate:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Match the hash-canonical MSVC lane from ADR-0015. CUDA kernels, WASM,
      # and native desktop targets are not compiled here and remain separate
      # local or deployment-specific validation responsibilities.
      - name: Configure focused CPU gate
        run: cmake -S engine -B engine/build -DFTD_ENABLE_CUDA=OFF

      - name: Build focused merge gate
        run: cmake --build engine/build --target ftd_merge_gate_build --config Release --parallel 4

      - name: Run merge gate
        working-directory: engine/build
        run: ctest -L merge_gate -j 32 -C Release --output-on-failure
