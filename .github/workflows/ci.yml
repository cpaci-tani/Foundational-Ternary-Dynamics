# FTD Continuous Integration Pipeline
# Runs tests, linting, and builds on every push and pull request

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run ruff linter
        run: ruff check . --output-format=github

      - name: Check code formatting with black
        run: black --check --diff .

  build-manuscript:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Render Quarto manuscript
        run: |
          cd manuscript
          quarto render --to html

      - name: Upload manuscript artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-html
          path: manuscript/_site/
          retention-days: 7

  validate-physics:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run physics validation tests
        run: |
          python -c "
          # Quick validation of core FTD constants
          import math

          # Lemniscatic constant G*
          G_star = math.sqrt(2) * (math.gamma(0.25)**2) / (2 * math.pi)

          # Master quadratic coefficients
          c = G_star
          x_plus = 8*c**2 + 8*c**2 * math.sqrt(1 - 1/c)
          x_minus = 8*c**2 - 8*c**2 * math.sqrt(1 - 1/c)

          # Verify alpha derivation
          alpha_inv_pred = x_plus
          alpha_inv_exp = 137.035999177
          error_ppm = abs(alpha_inv_pred - alpha_inv_exp) / alpha_inv_exp * 1e6

          print(f'G* = {G_star:.10f}')
          print(f'1/alpha predicted = {alpha_inv_pred:.10f}')
          print(f'1/alpha experimental = {alpha_inv_exp}')
          print(f'Error = {error_ppm:.2f} ppm')

          assert error_ppm < 10, f'Alpha derivation error {error_ppm} ppm exceeds 10 ppm threshold'
          print('Physics validation PASSED')
          "
