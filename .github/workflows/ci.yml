# FTD Continuous Integration Pipeline
# Runs Python tests, linting, physics validation, and the C++ engine merge
# gate (revision 1.2 / ADR-0015) on every push and pull request.
# Quarto manuscript is built locally (not in CI).

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Engine merge gate (ADR-0015, revision 1.2): CPU-only MSVC build + the
  # pinned-golden merge_gate bundle + unit label. Matches the platform the
  # golden hashes are pinned on (MSVC /fp:precise — see
  # engine/docs/DESIGN_RNG_PORTABILITY.md). GPU/campaign/benchmark labels
  # are excluded (GPU runs only on the local WSL2 RTX 5090 rig).
  # SOAK MODE: continue-on-error until one week of green runs, then flip to
  # required (ADR-0015 records the flip criteria).
  engine:
    runs-on: windows-latest
    continue-on-error: true   # SOAK — remove after a week of green runs
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure (CPU-only, Release)
        run: cmake -S engine -B engine/build -DFTD_ENABLE_CUDA=OFF

      - name: Build
        run: cmake --build engine/build --config Release --parallel 4

      - name: merge_gate bundle (pinned goldens + determinism)
        working-directory: engine/build
        run: ctest -L merge_gate -j 4 -C Release --output-on-failure

      - name: unit label (non-interactive; excl. known helium_scale1)
        working-directory: engine/build
        run: ctest -L unit -LE interactive -E "^helium_scale1$" -j 4 -C Release --timeout 600 --output-on-failure

      - name: compensated D3D checks previously covered by unit
        working-directory: engine/build
        run: ctest -R "^(d3d12_adapter_selection|d3d12_shared_buffer)$" -C Release --output-on-failure

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pytest scripts/tests/ --cov=scripts --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff linter
        run: ruff check . --output-format=github

  validate-physics:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate core constants
        run: |
          python - <<'PY'
          import math

          # G* = Gamma(1/4) / Gamma(3/4)
          G_star = math.gamma(0.25) / math.gamma(0.75)

          # Master quadratic: x^2 - 16*G*^2*x + 16*G*^3 = 0
          b = -16 * G_star**2
          c = 16 * G_star**3
          disc = b**2 - 4 * c
          x_plus = (-b + math.sqrt(disc)) / 2
          x_minus = (-b - math.sqrt(disc)) / 2

          alpha_inv_exp = 137.035999177
          match_ppm = abs(x_plus - alpha_inv_exp) / alpha_inv_exp * 1e6
          residual_plus = x_plus**2 - 16 * G_star**2 * x_plus + 16 * G_star**3
          residual_minus = x_minus**2 - 16 * G_star**2 * x_minus + 16 * G_star**3

          print(f"G* = {G_star:.10f}")
          print(f"x+ structural match = {x_plus:.10f}")
          print(f"x- quadratic root   = {x_minus:.10f}")
          print(f"x+ vs CODATA alpha^-1 match = {match_ppm:.2f} ppm")

          assert abs(G_star - 2.9587) < 0.001, f"G* = {G_star}, expected ~2.9587"
          assert abs(residual_plus) < 1e-10, f"x+ residual {residual_plus} too large"
          assert abs(residual_minus) < 1e-10, f"x- residual {residual_minus} too large"
          assert match_ppm < 10, f"x+ structural match drifted to {match_ppm} ppm"
          print("Core constant validation PASSED")
          PY
