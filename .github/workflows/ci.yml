# FTD Continuous Integration Pipeline
# Runs Python tests, linting, and static repository-integrity checks. Native
# source changes have a separate focused Windows gate; full engine validation
# remains local (ADR-0015). These checks do not certify physics claims.
# Quarto manuscript is built locally (not in CI).

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # 64 MiB build artifact, never committed; deterministic generator, and the
      # loader re-verifies the pinned SHA-256 (hydro/channels.py TABLE_HASH).
      - name: Generate strict hydro collision table
        working-directory: scripts
        run: python -m phi_v2_lattice.hydro.experiments.generate_tables

      - name: Run tests with coverage
        run: |
          pytest scripts/tests/ --cov=scripts --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff linter
        run: |
          ruff check . --output-format=github
          ruff check scripts/verification/verify_index_links.py scripts/verification/check_manuscript_v2_propagation.py --output-format=github

  repository-integrity:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify tracked public index links
        run: python scripts/verification/verify_index_links.py --tracked

      - name: Verify open and resolved tracker index
        run: python scripts/theory/build_open_items_index.py --check
