name: Web Source Gate

on:
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/web-source-gate.yml'
      - 'scripts/ci/**'
      - '.dependency-cruiser.json'
      - '.stylelintrc.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'engine/web/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/web-source-gate.yml'
      - 'scripts/ci/**'
      - '.dependency-cruiser.json'
      - '.stylelintrc.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'engine/web/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: web-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Route changes and reuse successful identical PR checks
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/ci_changes.py --workflow web-source-gate.yml --scope web

  source-and-shell:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            engine/web/tests/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install web dependencies
        run: npm ci

      - name: Install browser test dependencies
        run: npm ci --prefix engine/web/tests

      - name: Lint JavaScript, CSS, and module boundaries
        run: |
          npm run lint
          npm run lint:css
          npm run depcruise

      - name: Check JavaScript graphs and Observer types
        run: |
          npm run check:js-graph
          npm run check:assistant-graph
          npm run typecheck:observer

      - name: Run focused Node suites
        run: |
          npm run test:observer
          npm run test:assistant
          node --test engine/web/tests/scale3-liquid-labs.node.test.mjs

      - name: Build dashboard assets
        run: npm run build

      - name: Install Chromium and host libraries
        working-directory: engine/web/tests
        run: npx playwright install --with-deps chromium

      - name: Smoke-test dashboard shell and built assets
        run: npm --prefix engine/web/tests test -- -c playwright.config.js panel-mount.spec.js dashboard-asset-coverage.spec.js --workers=1
