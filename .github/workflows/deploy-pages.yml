name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pages.yml'
      - 'engine/CMakeLists.txt'
      - 'engine/cmake/**'
      - 'engine/web/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Engine gate (revision 1.3 / ADR-0015): a public deploy can no longer ship
  # an engine regression — the pinned-golden merge_gate bundle must pass on
  # the hash-canonical platform (windows MSVC) before Pages publishes. Only
  # the gate executables are built; the full suite remains a PR/manual check.
  engine-gate:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure (CPU-only, Release)
        run: cmake -S engine -B engine/build -DFTD_ENABLE_CUDA=OFF -DFTD_BUILD_EXPERIMENTAL=OFF

      - name: Build focused merge gate
        run: cmake --build engine/build --target ftd_merge_gate_build --config Release --parallel 4

      - name: merge_gate bundle (pinned goldens + determinism)
        working-directory: engine/build
        run: ctest -L merge_gate -j 32 -C Release --output-on-failure

  deploy:
    needs: engine-gate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: engine/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
