name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pages.yml'
      - 'engine/CMakeLists.txt'
      - 'engine/cmake/**'
      - 'engine/web/**'
      - 'scripts/assistant/**'
      - 'engine/ai-proxy/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Engine gate (revision 1.3 / ADR-0015): a public deploy can no longer ship
  # an engine regression — the pinned-golden merge_gate bundle must pass on
  # the hash-canonical platform (windows MSVC) before Pages publishes. Only
  # the gate executables are built; the full suite remains a PR/manual check.
  engine-gate:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure (CPU-only, Release)
        run: cmake -S engine -B engine/build -DFTD_ENABLE_CUDA=OFF

      - name: Build focused merge gate
        run: cmake --build engine/build --target ftd_merge_gate_build --config Release --parallel 4

      - name: merge_gate bundle (pinned goldens + determinism)
        working-directory: engine/build
        run: ctest -L merge_gate -j 32 -C Release --output-on-failure

  deploy:
    needs: engine-gate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned documentation extractor
        run: python -m pip install --require-hashes -r scripts/assistant/requirements.txt

      - name: Cache pinned browser models
        uses: actions/cache@v4
        with:
          path: engine/.cache/local-ai/models
          key: assistant-models-${{ hashFiles('engine/web/js/assistant/model-manifest.json') }}

      - name: Validate assistant transport
        run: node --test engine/ai-proxy/test/*.test.mjs

      - name: Stage public-only documentation and pinned browser models
        env:
          FTD_PUBLIC_AI_BASE: ${{ vars.FTD_PUBLIC_AI_BASE }}
        run: python scripts/assistant/stage_site.py --revision "$GITHUB_SHA" --output "${{ runner.temp }}/ftd-pages" --api-base "$FTD_PUBLIC_AI_BASE"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/ftd-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
