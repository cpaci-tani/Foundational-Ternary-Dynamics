[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ftd-fusion"
version = "1.0.0"
description = "Nuclear fusion energy derived from FTD first principles"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "FTD Research Group"}
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["nuclear physics", "fusion", "binding energy", "FTD", "first principles"]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "matplotlib>=3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
]

[project.urls]
Homepage = "https://github.com/ftd/ftd-fusion"
Documentation = "https://github.com/ftd/ftd-fusion/docs"
Repository = "https://github.com/ftd/ftd-fusion"
Issues = "https://github.com/ftd/ftd-fusion/issues"

[tool.setuptools.packages.find]
where = ["."]
